# Consolidated CI pipeline (BDL-050) — GitHub. ONE ordered pipeline so that
# merge-ability means "everything that protects the trunk is green":
#
#   PR open ─► gate ─┐
#             tests ─┼─(all green?)─► ai-techwriter ─► PR unblocked
#        site-build ─┘   └─(any red)──► ai-techwriter skipped → PR blocked
#
# gate / tests / site-build run in parallel on GitHub-hosted runners;
# ai-techwriter (the self-hosted runner where Goose + the API key live) has
# `needs: [gate, tests, site-build]`, so a broken PR never spends Qwen tokens.
# The ai-techwriter job calls the SAME entrypoint as the GitLab counterpart
# (python -m beadloom.ai_agents.ai_techwriter) — only the trigger, the secret naming, and
# --platform differ.
#
# ADOPTERS: `gate` runs `beadloom ci` (reindex -> lint -> sync-check ->
# config-check -> doctor) directly via uv — no extra setup. Required status
# checks (branch protection): require `gate`, `tests (3.10)`..`tests (3.13)`,
# `site-build`, `ai-techwriter` (these are the job names + matrix legs below).
# `beadloom setup-branch-protection` applies exactly this set.
name: CI

on:
  # Trunk-based: fire once per PR to main/master — run against the PR's own diff
  # (--since merge-base below). The agent commits its doc refresh ONTO the PR
  # head branch (--target pr-branch) so code + docs become one reviewable PR;
  # the loop-guard step keeps the agent's own push from re-triggering the
  # `synchronize` event.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  # Manual dispatch stays useful (re-run on demand over an explicit baseline).
  # It has no PR context, so it keeps the branch-PR publish path (HEAD~1 / the
  # given `since`), distinct from the pull_request path below.
  workflow_dispatch:
    inputs:
      since:
        description: "Baseline git ref for drift detection (default: HEAD~1)"
        required: false
        default: ""

# One run per PR; cancel a superseded run when a new commit lands.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The pr-branch publisher pushes the refresh commit (contents) + posts a PR
# comment (pull-requests).
permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------- #
  # gate — the `beadloom ci` verdict (reindex -> lint -> sync-check ->
  # config-check -> doctor) run directly via uv (no composite Action needed).
  # ---------------------------------------------------------------------- #
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra languages

      - name: Beadloom gate
        run: uv run beadloom ci --format github

  # ---------------------------------------------------------------------- #
  # tests — the 3.10-3.13 matrix. NO paths filter: it runs on every PR so each
  # leg is a reliable required check.
  # ---------------------------------------------------------------------- #
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra languages

      - name: Tests
        run: uv run pytest

  # ---------------------------------------------------------------------- #
  # tests-locale — the ENVIRONMENT DIMENSION. Runs the SAME whole suite as
  # `tests`, changing exactly ONE thing: the locale. The value is in the
  # DIFFERENCE between this leg and the `tests` legs, so never PIN a UTF-8
  # locale here — pinning makes every leg agree, which is indistinguishable
  # from having no dimension at all. A container is the default deployment,
  # and a container is usually not UTF-8.
  #
  # `LC_ALL=C` ALONE IS A VACUOUS LEG: PEP 540 auto-enables UTF-8 Mode under a
  # C/POSIX LC_CTYPE and PEP 538 coerces the C locale to C.UTF-8, so a bare
  # `LC_ALL=C` still reports a UTF-8 preferred encoding. `PYTHONUTF8=0` +
  # `PYTHONCOERCECLOCALE=0` are what make it real, and the assertion step below
  # fails the leg if the runner image puts it back on UTF-8 anyway.
  #
  # Two rows because they fail in OPPOSITE directions: under ASCII an
  # undecodable byte RAISES; under an 8-bit codec nothing raises and the byte is
  # SILENTLY MANGLED. Delete a row and you lose that direction, not just a leg.
  #
  # Both check-runs are REQUIRED by `beadloom setup-branch-protection`
  # (DEFAULT_STATUS_CHECK_CONTEXTS), so keep the job name and the matrix values
  # as they are, or drop the matching `--check` contexts when you change them.
  # ---------------------------------------------------------------------- #
  tests-locale:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: ["C", "en_US.ISO-8859-1"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra languages

      # NOT `locale-gen`: on ubuntu-24.04 `locale-gen en_US.ISO-8859-1` is
      # rejected, because /usr/share/i18n/SUPPORTED spells that entry
      # `en_US ISO-8859-1`. `localedef` builds it directly in ~0.25s.
      - name: Build the 8-bit locale
        if: matrix.locale != 'C'
        run: |
          name="${{ matrix.locale }}"
          sudo localedef -i "${name%%.*}" -f "${name#*.}" "$name"

      - name: Assert the leg is genuinely non-UTF-8
        env:
          LC_ALL: ${{ matrix.locale }}
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
        run: |
          uv run python - <<'PY'
          import codecs, locale, os, sys

          declared = os.environ["LC_ALL"]
          preferred = codecs.lookup(locale.getpreferredencoding(False)).name
          filesystem = codecs.lookup(sys.getfilesystemencoding()).name
          print(f"declared={declared} preferred={preferred} "
                f"fs={filesystem} utf8_mode={sys.flags.utf8_mode}")
          if "utf-8" in (preferred, filesystem):
              raise SystemExit(
                  f"VACUOUS LEG: {declared} came back as UTF-8 "
                  f"(preferred={preferred} fs={filesystem}), so this leg asserts "
                  "nothing about the environment dimension."
              )
          if "." in declared:
              want = codecs.lookup(declared.split(".", 1)[1]).name
              if (preferred, filesystem) != (want, want):
                  raise SystemExit(
                      f"DEGRADED LEG: {declared} did not take effect (expected "
                      f"{want}, got preferred={preferred} fs={filesystem}) — the "
                      "locale is probably not built on this image, so this leg is "
                      "a duplicate of the C row."
                  )
          PY

      - name: Whole suite under ${{ matrix.locale }}
        env:
          LC_ALL: ${{ matrix.locale }}
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
        run: uv run pytest

  # ---------------------------------------------------------------------- #
  # tests-windows — the PLATFORM dimension. Runs the SAME whole suite as
  # `tests`, changing exactly ONE thing: the operating system. Separators,
  # absolute-path parsing, case-folding, file locking and process spawning all
  # change at once, and a project whose code has no platform branches is either
  # genuinely portable or has never been asked — two states an all-green Linux
  # pipeline cannot tell apart.
  #
  # THE PROBE BELOW IS NOT OPTIONAL. It fails the leg two ways: VACUOUS (the
  # runner is not Windows at all) and DEGRADED (it is, but this process cannot
  # create a symbolic link — on Windows that is SeCreateSymbolicLinkPrivilege,
  # granted by Developer Mode). Without the second check, every test that needs
  # a symlink skips and ~all the green is carried by tests that never needed
  # Windows. `shell: bash` is load-bearing: the default shell on windows-latest
  # is pwsh, which has no POSIX heredoc.
  #
  # THIS ONE IS NOT ON-THESIS FOR EVERY PROJECT, unlike `tests-locale` (a
  # container is the default deployment and is usually not UTF-8). If your
  # product only ever runs on Linux, DELETE THIS JOB **AND** drop the matching
  # required context, or your `main` becomes unmergeable on a check that never
  # reports:
  #
  #     beadloom setup-branch-protection \
  #       --check gate --check 'tests (3.10)' --check 'tests (3.11)' \
  #       --check 'tests (3.12)' --check 'tests (3.13)' \
  #       --check 'tests-locale (C)' --check 'tests-locale (en_US.ISO-8859-1)' \
  #       --check site-build --check ai-techwriter
  #
  # Deleting the job alone is the lockout; the two edits go together.
  #
  # COST: ~8-14 minutes at GitHub's 2x Windows billing multiplier, and unlike
  # the locale rows it is NOT free in wall-clock — it becomes the pipeline's
  # critical path. It is deliberately absent from `ai-techwriter`'s `needs:` so
  # the doc refresh is not held behind it.
  # ---------------------------------------------------------------------- #
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra languages

      - name: Assert the leg is genuinely Windows and can link
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          if sys.platform != "win32" or os.sep != "\\":
              raise SystemExit(
                  f"VACUOUS LEG: this runner reports platform={sys.platform!r} "
                  f"sep={os.sep!r}, so nothing it measures is a Windows fact."
              )

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              target = root / "target.txt"
              target.write_text("probe\n", encoding="utf-8")
              link = root / "link.txt"
              try:
                  os.symlink(target, link)
              except OSError as exc:
                  raise SystemExit(
                      f"DEGRADED LEG: this process cannot create a symbolic link "
                      f"({exc}). On Windows that is SeCreateSymbolicLinkPrivilege, "
                      "granted by Developer Mode or an elevated shell; without it "
                      "every test that needs a link silently skips."
                  ) from exc
              if link.resolve() != target.resolve():
                  raise SystemExit(
                      "DEGRADED LEG: a symbolic link was created but resolved to "
                      f"{link.resolve()} instead of {target.resolve()}."
                  )
          print(f"platform={sys.platform} sep={os.sep!r} symlinks=yes")
          PY

      - name: Whole suite on Windows
        run: uv run pytest

  # ---------------------------------------------------------------------- #
  # site-build — regenerate + build the docs site on every PR (the BUILD half,
  # no deploy) so doc/site breaks are caught BEFORE they land on the trunk.
  # ---------------------------------------------------------------------- #
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra languages

      - name: Reindex graph
        run: uv run beadloom reindex

      - name: Generate the site from the graph
        run: uv run beadloom docs site --out site

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build the site
        run: npm run docs:build
        working-directory: site

  # ---------------------------------------------------------------------- #
  # ai-techwriter — runs ONLY after gate + tests + site-build are green
  # (`needs:`), so a broken PR never spends Qwen tokens. Body preserved from the
  # BDL-049 model — only the trigger / secret naming / --platform differ.
  # ---------------------------------------------------------------------- #
  ai-techwriter:
    needs: [gate, tests, site-build]
    # Self-hosted runner where Goose + the API key live.
    runs-on: [self-hosted, ai-techwriter]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so git diff / the merge-base / the gate can read prior
          # state; check out the PR HEAD branch so the agent can commit onto it.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          # Persist a PAT (AI_TW_PAT) as the credential `git push` uses.
          # WHY: GitHub does NOT re-trigger workflows on pushes authored by the
          # default GITHUB_TOKEN (anti-recursion) — so the agent's refresh
          # commit would NOT fire your required status check (e.g.
          # `beadloom-gate`), leaving it missing on the PR HEAD → unmergeable.
          # A PAT-authored push is a normal push → it triggers the check.
          # ADOPTERS: create a repo secret `AI_TW_PAT` (fine-grained PAT:
          # Contents RW + Pull-requests RW on this repo). WITHOUT it, the agent's
          # commit will NOT auto-trigger the required check — you'd have to
          # re-run checks manually (or push an empty commit) to mark it green.
          # Falls back to github.token when AI_TW_PAT is absent.
          token: ${{ secrets.AI_TW_PAT || github.token }}

      # Loop-guard: if the PR head commit is the agent's own refresh (authored
      # by beadloom-ai-techwriter OR a [skip ai-techwriter] subject), skip — the
      # agent's push must not spawn a second `synchronize` run.
      - name: Loop-guard (skip the agent's own refresh commit)
        run: |
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          if [ "$author" = "beadloom-ai-techwriter" ] || \
             printf '%s' "$subject" | grep -qF '[skip ai-techwriter]'; then
            echo "skip: PR head is the agent's own refresh commit"
            echo "AI_TW_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Install uv
        if: env.AI_TW_SKIP != '1'
        uses: astral-sh/setup-uv@v6

      # Beadloom (the substrate) + the harness deps, pinned via the lockfile.
      - name: Install Beadloom + harness deps
        if: env.AI_TW_SKIP != '1'
        run: uv sync --extra dev --extra languages

      # Goose is provisioned on the self-hosted runner image (pinned there).
      - name: Verify Goose is available (pinned on the runner)
        if: env.AI_TW_SKIP != '1'
        run: goose --version

      # Rebuild the index so sync-check sees current code↔doc state.
      - name: Beadloom reindex
        if: env.AI_TW_SKIP != '1'
        run: uv run beadloom reindex

      # PR path: --since is the merge-base of the PR base and HEAD — exactly
      # "what this PR changed" (robust when the branch is behind/ahead of base).
      # Falls back to the PR base SHA if merge-base cannot resolve. The agent
      # commits the refresh onto the PR head branch + comments on the PR.
      - name: Run AI tech-writer harness (GitHub · pr-branch)
        if: env.AI_TW_SKIP != '1' && github.event_name == 'pull_request'
        env:
          # Repository secret — never inlined; resolved only on the runner.
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # Workspace-specific MaaS endpoint (secret); falls back to the generic
          # DashScope gateway in the harness when unset.
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          # gh push + gh pr comment authenticate with the PAT so the agent's
          # refresh commit triggers your required status check (GITHUB_TOKEN
          # pushes are non-recursive — see the checkout token comment above).
          # Falls back to GITHUB_TOKEN when AI_TW_PAT is absent.
          GH_TOKEN: ${{ secrets.AI_TW_PAT || secrets.GITHUB_TOKEN }}
          # The pr-branch publisher resolves the PR to comment on from this.
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          since="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
          if [ -z "$since" ]; then since="$BASE_SHA"; fi
          uv run python -m beadloom.ai_agents.ai_techwriter \
            --platform github --target pr-branch --since "$since"

      # Manual dispatch path: no PR context, so keep the branch-PR publish path
      # (cuts a doc-refresh branch + opens a PR). --since is the operator input
      # when given, else HEAD~1.
      - name: Run AI tech-writer harness (GitHub · branch-pr · manual)
        if: env.AI_TW_SKIP != '1' && github.event_name == 'workflow_dispatch'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          since="${INPUT_SINCE:-HEAD~1}"
          case "$since" in "") since="HEAD~1" ;; esac
          uv run python -m beadloom.ai_agents.ai_techwriter \
            --platform github --target branch-pr --since "$since"
