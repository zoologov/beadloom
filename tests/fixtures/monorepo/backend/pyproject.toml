[project]
name = "metrics-desk-backend"
version = "0.7.0"
description = "Builds the daily digest of the metrics the desk tracks."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest", "src/file_history", "src/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
