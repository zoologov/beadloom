[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beadloom"
dynamic = ["version"]
description = "The architecture graph of your codebase, and the gate that holds documentation, boundaries, cross-repo contracts and the agentic workflow to it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Beadloom Contributors" },
]
keywords = ["ai", "context", "documentation", "mcp", "knowledge-graph"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    # BOUNDED on purpose (BDL-UX #150): tree-sitter is the ABI host that loads
    # every grammar wheel, and the grammars only declare their core requirement
    # under their `core` extra — which a normal install never activates. An
    # unbounded pin therefore let a fresh install pair core 0.26 with the
    # current grammar wheels, which SEGFAULTS partway through a real reindex
    # (small parses survive; the crash needs volume, which is why it reached
    # users). Widen the ceiling only after a full-repo reindex has been run
    # against the new core — loading the grammars is not enough evidence.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25",
    "mcp>=2.0",
    # The portal reads the Markdown of a project with the parser VitePress uses
    # (BDL-076, beadloom-ujzb.21). markdown-it-py 4.x is the port of markdown-it
    # 14.1, the version VitePress 1.6.4 bundles. rich already pulls markdown-it-py
    # (>=2.2.0, resolved to 4.2.0 here); the 2.x and 3.x lines port markdown-it
    # 12 and 13, and this reading was verified against 4.2.0 only, so the floor
    # is the line that ports the parser VitePress itself runs. The ceiling is the
    # next major (beadloom-ujzb.23): the positions are read from internals of the
    # parser that are not its public API (Ruler.__find__ and Ruler.__rules__, the
    # StateBlock line arrays), which a major version is free to change.
    "markdown-it-py>=4.0,<5",
]

[project.optional-dependencies]
languages = [
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-java>=0.23",
    "tree-sitter-swift>=0.7",
    "tree-sitter-objc>=3.0",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
]
search = [
    "sqlite-vec>=0.1",
    "fastembed>=0.4",
]
watch = [
    "watchfiles>=0.20",
]
graphql = [
    # Optional: enables the TYPED GraphQL Tier-A surface (field types +
    # nullability/list wrapping + args). Absent -> honest name-level fallback
    # (the regex scanner in graph/sdl.py). Never a hard dependency.
    "graphql-core>=3.2",
]
tui = [
    "textual>=0.80",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # Gherkin scenarios RUN (BDL-061 S4). Without a runner a `.feature` file is
    # prose, and `scenario-coverage` would check the existence of text — the
    # decision it enforces ("an executable artifact cannot silently lie") only
    # holds while the artifact executes.
    "pytest-bdd>=7.0",
    # Randomized test order each run — surfaces order-dependence (BDL-059 S1).
    "pytest-randomly>=3.15",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
# The mutation RUNNER is this repository's dev dependency and nothing else
# (BDL-068 S3, CONTEXT's tool-agnosticism constraint). It is deliberately NOT in
# `dev` and NOT in `all`: every CI leg installs those, and a runner an adopter
# never needs has no business on the path of a `uv sync --extra dev`. What
# Beadloom ships for mutation testing is the declared SCOPE (`mutation.targets`
# in .beadloom/flow.yml) and the REPORT format -- never a required runner.
mutation = [
    "mutmut>=3.7",
]
all = [
    "beadloom[languages,dev,tui,watch,graphql]",
]

[project.scripts]
beadloom = "beadloom.services.cli:main"
# The governed AI tech-writer harness ships inside the wheel (BDL-051 / S2);
# CI normally invokes `python -m beadloom.ai_agents.ai_techwriter`, this console
# entry is the equivalent direct invocation.
beadloom-ai-techwriter = "beadloom.ai_agents.ai_techwriter.cli:main"

[tool.hatch.version]
path = "src/beadloom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beadloom"]
# Ship the harness's non-Python operator artifacts (the Goose recipe + the
# runner provisioner) as package data so they resolve via importlib.resources
# from the installed wheel (BDL-051 / S2 — no more vendoring).
[tool.hatch.build.targets.wheel.force-include]
"src/beadloom/ai_agents/ai_techwriter/recipe.yaml" = "beadloom/ai_agents/ai_techwriter/recipe.yaml"
"src/beadloom/ai_agents/ai_techwriter/provision-runner.sh" = "beadloom/ai_agents/ai_techwriter/provision-runner.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
# PREVIEW IS ON FOR ONE RULE, AND `explicit-preview-rules` IS WHAT MAKES THAT
# TRUE (BDL-061.68). PLW1514 (`unspecified-encoding`) is the mechanical half of
# the decode family this epic repaired five times by hand: text I/O that leaves
# the codec to `locale.getpreferredencoding(False)`. It is still a preview rule
# in ruff 0.16.3, and selecting a preview rule WITHOUT `preview = true` is not an
# error — ruff prints "has no effect because preview is not enabled" on stderr
# and exits 0, i.e. the gate reads as configured while checking nothing. So the
# three settings travel together, and tests/test_decode_handlers.py fails if any
# of them is removed.
#
# `explicit-preview-rules` keeps every OTHER preview rule out, so turning this
# on does not silently enlist whatever lands in preview next. It does not stop
# preview from changing the behaviour of STABLE rules, and the cost of that here
# was measured, not assumed: exactly one new finding, RUF002 on a deliberate
# latin-1 mojibake docstring in tests/test_decoding_symmetry.py, answered by a
# `noqa` on that line rather than by editing the measurement it records. Ruff is
# pinned by uv.lock, so further preview drift arrives with a reviewed lockfile
# bump and never on its own.
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "PLW1514",  # pylint: text I/O must state its encoding (preview; see above)
]
ignore = [
    "S101",  # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# BDL-046 BEAD-11: the bilingual About cross-link test uses the intentional
# Cyrillic label "Русский" — RUF001 ambiguous-unicode is a false positive for a
# deliberate non-Latin UI string.
"tests/unit/application/site/test_site_about.py" = ["RUF001", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
packages = ["beadloom"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["watchfiles", "watchfiles.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

# graphql-core is an OPTIONAL extra (beadloom[graphql]); the runtime import is
# guarded (try/except ImportError -> honest name-level fallback). Declare it
# ignore_missing_imports so `mypy --strict` stays clean in a minimal env without
# the extra; CI's tests job installs --extra graphql so the typed path is checked.
[[tool.mypy.overrides]]
module = ["graphql", "graphql.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["beadloom"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

# ---------------------------------------------------------------------------
# mutmut -- the first mutation slice (BDL-068 S3.1)
# ---------------------------------------------------------------------------
# TOOL DECIDED in ROADMAP (researched 2026-09-01) against cosmic-ray,
# pytest-gremlins, poodle, mutatest, MutPy and mutahunter. The deciding property
# is per-mutant test selection from coverage: mutation cost is mutants x
# time-per-run, and cosmic-ray answers cost with horizontal distribution instead
# -- which this project already declined once, when beadloom-mr2l.64 withdrew
# `tests-windows` over runner minutes.
#
# `source_paths` is the whole package because mutmut copies it into `mutants/`
# and imports it there; `only_mutate` is what selects the declared scope out of
# it. The two are different jobs and only the second is the scope.
#
# THE SCOPE IS DECLARED TWICE ON PURPOSE and the two homes are held together by
# a test IN BOTH DIRECTIONS: `.beadloom/flow.yml` carries `mutation.targets`,
# which is what SHIPS and what `config-check` reads, and this block is what the
# runner reads. tests/self_check/config/test_mutation_runner_scope.py fails if they disagree
# either way. The second direction was added on 2026-09-04 because it had been
# missing and something had walked through the hole: `only_mutate` named
# `graph/rules/*` alone while the declaration named `doc_quality.py` and
# `doc_shape.py` too, so those two were unreachable by any run rather than
# awaiting one, and the job's `--only` suppressed the one finding that says so.
#
# THE TEST POOL IS DERIVED, NOT CHOSEN, and the derivation is written down so it
# can be run again:
#
#   pytest --cov=<the declared module> --cov-context=test
#   select distinct context from arc join context ...   # the coverage database
#
# TWO RUNS READ THIS POOL SINCE BDL-074 D1, and one of them rewrites it per run.
# The weekly sample runs against it as written. A pull request's run replaces it
# in its own checkout (`.github/scripts/mutmut_adapter.py select`, never
# committed) with the tests the binding ties to the changed nodes PLUS the
# entries below that the binding places under no node -- the fallback, which is
# every entry while tests are unplaced and none once each one is laid out under
# `tests/{unit,integration}/`.
#
# 73 test files execute graph/rules/ (measured 2026-09-03 over 8 195 tests),
# and a 74th imports the package at COLLECTION time, where a coverage context
# does not reach -- it was added by the import check named below, on its first
# run, which is the check earning its place.
#
# The six file targets were derived the same way on 2026-09-04, in one pass over
# 8 813 passing tests: 41 test files execute doc_shape.py, 14 role_duties.py, 8
# guards/surface.py, 7 waves/derivation.py, 6 doc_quality.py and 2
# guards/shell_targets.py. Their union is 64 files, 21 of them already here, so
# the pool grew by 41 -- 43 derived, minus the two exclusions named below.
# They are listed below because mutmut needs the pool statically, and a list is
# the thing this epic distrusts -- so two things are stated about it rather than
# hoped for. FIRST, the failure direction: a killer test OUTSIDE the pool cannot
# be selected for a mutant, so the mutant survives and the score UNDER-claims. A
# stale pool therefore understates test strength; it can never overstate it.
# SECOND, tests/self_check/config/test_mutation_runner_scope.py fails if a pool entry no longer
# exists, or if a test file that imports the rules package directly is missing
# from the pool.
#
# ONE DERIVED ENTRY WAS EXCLUDED, and the reason was the room rather than taste:
# test_bead15_s3b_coverage.py, then at the top of tests/, ran `sync-check` over
# the tree it is in, and
# in `mutants/` that tree is a MUTATED copy — every mutated module has a different
# hash, so the pairs are stale by construction and the test cannot pass there.
# The 2026-09-04 derivation returned it a second time, through doc_shape.py; the
# other 42 new entries were run in a room with no `.git` and reported 1 failed,
# 971 passed, 17 skipped -- the one failure being this file. BDL-074 A3 moved its
# tree-reading checks to tests/self_check/, and E1 split the synthetic rest by
# node and deleted the file: the two rule-engine parts
# (tests/integration/graph/rules/test_an_uncovered_module_fails_strict_lint_at_error_severity.py,
# tests/integration/graph/rules/test_a_directory_source_covers_its_whole_subtree.py)
# and the freshness-skip part
# (tests/unit/doc_sync/engine/test_a_freshness_skip_needs_a_missing_baseline.py)
# are in the pool below, and nothing of the file is excluded any more.
#
# A SECOND ENTRY IS EXCLUDED, found by running the derived pool in `mutants/`
# rather than by reasoning about it: tests/test_bead18_s5_relation.py reads
# `.beads/issues.jsonl`, the tracker export, and `also_copy` does not carry
# `.beads` -- 263 MB locally, holding an embedded database, for one file. Eight
# of its cases fail there with FileNotFoundError. It reaches doc_shape.py, so
# again the cost is in the under-claiming direction.
#
# THAT EXCLUSION WAS NOT PREDICTED BY THE CHEAPER ROOM, which is the reason to
# run the expensive one: the same 43 files reported one failure in a `git
# archive HEAD` room with no `.git`, and eight more in `mutants/`. A room that
# reproduces one property of another room answers about that property only.
#
# ONE ENTRY CONTRIBUTES SKIPS RATHER THAN KILLERS, which is worth saying because
# it looks like coverage: tests/test_a_commit_is_judged_against_the_declared_axes.py
# reads named commits out of git history and skips each case whose commit is not
# in the checkout. `mutants/` has no repository, so it skips there too. Again the
# under-claiming direction.
#
# THE WHOLE SUITE WAS TRIED FIRST AND DOES NOT FIT THE ROOM. mutmut runs the
# pool inside `mutants/`, over a MUTATED copy of the package and without a
# `.git` directory.
# Measured there: 14 failures and 7 errors, and the irreducible ones are
# structural -- the meta-tests that lint the shipped package (it is mutated by
# construction) and the ones that walk git history (there is no repository).
# The derived pool runs green in that room; the whole suite cannot.
#
# `also_copy` is what makes the pool runnable in `mutants/` at all: mutmut copies
# the source and the tests and runs there, so this project's meta-tests -- the
# ones that read ci.yml, the graph, the shipped documents -- fail in the copy
# unless the tree they read comes with them. MEASURED in the copied room over
# the derived pool: 77 failures and 12 errors before these paths were copied,
# 0 after (2026-09-03).
[tool.mutmut]
source_paths = ["src/beadloom"]
only_mutate = [
    "src/beadloom/application/active_table/row_ids.py",
    "src/beadloom/application/active_table/staging.py",
    "src/beadloom/application/guards/shell_targets.py",
    "src/beadloom/application/guards/surface.py",
    "src/beadloom/application/waves/derivation.py",
    "src/beadloom/application/waves/landing.py",
