# Consolidated PR pipeline (BDL-050) — replaces the three independent PR
# workflows (beadloom-gate.yml / tests.yml / ai-techwriter.yml) with ONE ordered
# pipeline so merge-ability means "everything that protects main is green":
#
#   PR open ─► gate ─┐
#             tests ─┼─(all green?)─► ai-techwriter ─► PR unblocked
#        site-build ─┘   └─(any red)──► ai-techwriter skipped → PR blocked
#      tests-locale ──(the environment dimension; not in ai-techwriter's needs)
#
# gate / tests / tests-locale / site-build run in parallel on GitHub-hosted
# runners; there is no platform dimension — it was built, priced and declined
# (beadloom-mr2l.64; the reasoning is where the job used to be, below);
# ai-techwriter (self-hosted VPS where Goose + the API key live) has
# `needs: [gate, tests, site-build]` so a broken PR never spends Qwen tokens.
# deploy-site.yml stays the ONLY thing on push:main (main is green by
# construction under strict trunk-based — BDL-049).
name: CI

on:
  # Trunk-based (BDL-049): fire once per PR to main/master.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  # Manual dispatch keeps the ai-techwriter branch-PR fallback (no PR context).
  workflow_dispatch:
    inputs:
      since:
        description: "Baseline git ref for drift detection (default: HEAD~1)"
        required: false
        default: ""

# One run per PR; cancel a superseded run when a new commit lands.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ai-techwriter's pr-branch publisher pushes the refresh commit (contents) +
# posts a PR comment (pull-requests).
permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------- #
  # gate — the beadloom ci verdict (reindex -> lint -> sync-check -> doctor).
  # Same composite Action satellites consume (was beadloom-gate.yml).
  # ---------------------------------------------------------------------- #
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Beadloom gate
        uses: ./.github/actions/beadloom-gate
        with:
          format: github

  # ---------------------------------------------------------------------- #
  # tests — the 3.10-3.13 matrix (was tests.yml). NO paths filter: it runs on
  # every PR so each leg is a reliable required check (G2).
  # ---------------------------------------------------------------------- #
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra languages --extra tui --extra watch --extra graphql

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type check (mypy)
        # The AI tech-writer harness moved into src/beadloom/ai_agents/ (BDL-051 S2),
        # so it's covered by `src/` — no separate `tools/` path anymore.
        run: uv run mypy src/

      - name: Tests with coverage
        # BEADLOOM_REQUIRE_LANGUAGE_GRAMMARS makes the grammar guard
        # (tests/test_grammar_guard.py) FAIL — not skip — if any tree-sitter
        # grammar from the `languages` extra is missing, so the TS/Go/Rust/…
        # language tests can never silently skip-and-pass in CI (BDL-059 S1).
        env:
          BEADLOOM_REQUIRE_LANGUAGE_GRAMMARS: "1"
        run: uv run pytest --cov=beadloom --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------------- #
  # tests-locale — the ENVIRONMENT DIMENSION (BDL-061.38).
  #
  # BOTH ROWS ARE EXPECTED GREEN since BDL-061.42. They were not: the first run
  # measured 108 locale-attributable failures under ASCII and 83 under the 8-bit
  # locale (an earlier count of 100/76 was taken on a smaller tree). THE VALUE IS
  # THE DELTA BETWEEN LEGS, NEVER ANY LEG'S COLOUR — this green means the delta
  # against the UTF-8 leg is 0 and 0, re-measured on the fixed tree, and it does
  # NOT mean the dimension found nothing. The one way to make these legs green
  # dishonestly is to pin UTF-8, which is the single thing this file may not do;
  # tests/test_ci_locale_dimension.py fails the suite if anyone tries.
  #
  # WHAT IT FOUND, so a future reader knows the cost was repaid: one product call
  # site that could not write a git hook at all on a non-UTF-8 image, four
  # subprocess seams decoding in the image's locale, a federation export that
  # raised UnicodeEncodeError on a project path, and — only on the 8-bit row,
  # never on the ASCII one — a CLI whose `--help` exited 1 and whose passing
  # guard verdict vanished, because CPython gives the C locale a tolerant stdout
  # handler and a named 8-bit locale a strict one.
  #
  # The two check-runs are NOT yet part of main's live branch protection (7
  # required contexts, not the 9 that `beadloom setup-branch-protection` would
  # apply). Now that both rows have been measured green they can be, by running
  # that command once; the sequencing is stated in docs/services/cli.md next to it.
  #
  # Runs the SAME whole suite as `tests`, changing exactly ONE thing: the
  # locale. The value is in the DIFFERENCE between this leg and the `tests`
  # legs, so nothing in this file may ever PIN a UTF-8 locale — pinning would
  # have hidden BDL-061.36's defect from us while shipping it to every adopter
  # running in a container, which is the default deployment, not an edge case.
  # tests/test_ci_locale_dimension.py asserts that invariant so the tempting
  # "fix" (pin UTF-8 until the leg goes green) fails the suite.
  #
  # WHAT IT BUYS, measured rather than argued: .36's locale defect failed on
  # ALL FOUR python legs and was invisible to a 5574-test local suite; its
  # symlink-loop defect was invisible because the one interpreter the owner runs
  # (3.13) does not raise where 3.10-3.12 do. Both are DIMENSION failures — more
  # tests along the existing axis would not have found either.
  #
  # WHY THE KNOBS: `LC_ALL=C` ALONE IS A VACUOUS LEG. Measured for this bead on
  # python:3.12-slim — bare `LC_ALL=C` reports preferred=utf-8, fs=utf-8,
  # utf8_mode=1, because PEP 540 auto-enables UTF-8 Mode under a C/POSIX
  # LC_CTYPE (and PEP 538 coerces the C locale to C.UTF-8). Adding
  # `PYTHONUTF8=0` gives preferred=ANSI_X3.4-1968, fs=ascii; `PYTHONCOERCECLOCALE=0`
  # is belt-and-braces for images where the PEP 538 half is what bites. We do
  # not have to be right about which knob does the work: the "Assert the leg is
  # genuinely non-UTF-8" step below FAILS the leg if the image puts it back on
  # UTF-8, so this can never become theatre silently.
  #
  # WHY TWO ROWS: they fail in OPPOSITE directions. Under ASCII an undecodable
  # byte RAISES (loud, fail-closed-but-wrong); under an 8-bit codec nothing
  # raises and the byte is SILENTLY MANGLED into a character nobody sent. .36
  # measured this: its first sabotage passed 302/302 until a latin-1 row was
  # added, because a decoder that accepts every byte escapes nothing.
  #
  # ONLY THE LOCALE VARIES: python is 3.13 (the version the owner runs locally,
  # so a red leg is attributable to the locale and to nothing else — the version
  # dimension is the `tests` matrix's job), the extras are byte-identical to the
  # `tests` leg, and the locale env is applied to the SUITE step only — an
  # install broken by the locale would confound the signal, not produce it.
  #
  # COST: ~4 runner-minutes per row, fanned out in parallel with the four
  # `tests` legs, so the pipeline's WALL-CLOCK is unchanged (~4 min); the added
  # cost is ~8 runner-minutes per PR. No `--cov`: coverage is a property of the
  # code, not of the locale, and the `tests` legs already enforce the floor.
  # ---------------------------------------------------------------------- #
  tests-locale:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single axis, so the check-run names are exactly
        # `tests-locale (C)` / `tests-locale (en_US.ISO-8859-1)` — the names
        # branch_protection.DEFAULT_STATUS_CHECK_CONTEXTS must match verbatim.
        locale: ["C", "en_US.ISO-8859-1"]
      # The rows fail in different directions; cancelling the siblings on the
      # first red one would throw away the half of the signal we came for.
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra languages --extra tui --extra watch --extra graphql

      # `C` is always present; a real 8-bit locale has to be BUILT — and not
      # with the obvious spelling. MEASURED on ubuntu:24.04:
      # `locale-gen en_US.ISO-8859-1` is REJECTED ("not a supported language or
      # locale") because /usr/share/i18n/SUPPORTED spells that entry
      # `en_US ISO-8859-1`. `localedef` builds it directly in ~0.25s, `locale -a`
      # then lists `en_US.iso88591`, and LC_ALL=en_US.ISO-8859-1 resolves to it
      # (preferred=iso8859-1 fs=iso8859-1 utf8_mode=0, and a 'café.py' filename
      # round-trips). The -i/-f arguments are DERIVED from the matrix value so a
      # third row (say ru_RU.CP1251) needs no edit here.
      - name: Build the 8-bit locale
        if: matrix.locale != 'C'
        run: |
          name="${{ matrix.locale }}"
          sudo localedef -i "${name%%.*}" -f "${name#*.}" "$name"
          locale -a

      # Anti-vacuity guard, and it guards TWO ways of asserting nothing:
      #   VACUOUS  — the runner put the leg back on UTF-8 (see the knobs above),
      #              so the dimension does not exist on this image at all;
      #   DEGRADED — LC_ALL names a locale the image does not have, so glibc
      #              silently falls back to POSIX/ASCII. The leg would still be
      #              non-UTF-8 and still read green, while being a duplicate of
      #              the `C` row — the 8-bit direction (bytes that MANGLE rather
      #              than raise) would vanish and nobody would be told.
      # This script is executed by tests/test_ci_locale_dimension.py, so its
      # logic is covered by the suite rather than only by this file being read.
      - name: Assert the leg is genuinely non-UTF-8
        env:
          LC_ALL: ${{ matrix.locale }}
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
        run: |
          uv run python - <<'PY'
          import codecs, locale, os, sys

          declared = os.environ["LC_ALL"]
          preferred = codecs.lookup(locale.getpreferredencoding(False)).name
          filesystem = codecs.lookup(sys.getfilesystemencoding()).name
          print(f"declared={declared} preferred={preferred} "
                f"fs={filesystem} utf8_mode={sys.flags.utf8_mode}")
          if "utf-8" in (preferred, filesystem):
              raise SystemExit(
                  f"VACUOUS LEG: {declared} came back as UTF-8 "
                  f"(preferred={preferred} fs={filesystem}), so this leg asserts "
                  "nothing about the environment dimension."
              )
          if "." in declared:
              want = codecs.lookup(declared.split(".", 1)[1]).name
              if (preferred, filesystem) != (want, want):
                  raise SystemExit(
                      f"DEGRADED LEG: {declared} did not take effect (expected "
                      f"{want}, got preferred={preferred} fs={filesystem}) — the "
                      "locale is probably not built on this image, so this leg is "
                      "a duplicate of the C row."
                  )
          PY

      - name: Whole suite under ${{ matrix.locale }}
        env:
          LC_ALL: ${{ matrix.locale }}
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          # Same as the `tests` legs: a missing tree-sitter grammar must FAIL,
          # not skip (BDL-059 S1) — otherwise the language tests could vanish
          # from this leg and take the dimension's reach with them.
          BEADLOOM_REQUIRE_LANGUAGE_GRAMMARS: "1"
        run: uv run pytest

  # ---------------------------------------------------------------------- #
  # THE PLATFORM DIMENSION IS NOT SHIPPED — built and priced in BDL-061.39,
  # declined by the owner in beadloom-mr2l.64 (2026-08-24). The decision is
  # recorded here and not only in the bead, because the question a reader
  # arrives with is "why does this pipeline vary the locale but not the
  # operating system?", and they arrive with it while reading this file.
  #
  # THE REASON IS COST, and .39 measured it rather than estimating it. A
  # `windows-latest` leg runs this suite in ~8-14 minutes (~6100 tests doing a
  # great deal of tempdir + sqlite work, which is where Windows is slowest) and
  # GitHub bills Windows at 2x => ~16-28 runner-minutes per PR, against ~8 for
  # both locale rows together. Unlike those rows it is not free in wall-clock
  # either: the ubuntu legs finish in ~4 minutes, so the Windows leg becomes the
  # pipeline's critical path and PR-to-merge latency roughly triples. Windows is
  # not in this project's target audience, so the dimension is not bought.
  #
  # WHAT IS THEREFORE NOT CLAIMED, said plainly rather than left to be inferred
  # from a green pipeline: nothing in this repository has ever executed on
  # Windows, and by this decision nothing will. `src/` contains no
  # `sys.platform` and no `os.name` branch anywhere, so the product is either
  # genuinely platform-neutral or has simply never been asked — and an all-green
  # ubuntu pipeline cannot tell those two states apart. Unverified BY DECISION
  # (a third state, next to verified and next to known-broken): the backslash
  # refusal in application/guards/paths.py, which exists FOR Windows harnesses
  # and refuses the spelling every one of them produces (beadloom-mr2l.60);
  # `Path.resolve`, drive-letter parsing and case-folding; sqlite/WAL file
  # locking, temp-dir cleanup over open handles, and the tree-sitter wheels.
  #
  # WHAT THIS DECISION DOES NOT UNDO, because it was never about the runner: the
  # six guard tests that carried `skipif(sys.platform == "win32")` are gated on
  # a MEASURED symlink capability (tests/symlink_capability.py) and run on any
  # runner that holds it, and tests/test_windows_dimension.py fails the suite if
  # a platform skip is ever re-added unjudged. Both hold with or without a leg.
  #
  # RE-ADDING IT LATER: the job, its anti-vacuity probe — a Windows runner that
  # cannot create a symbolic link would capability-skip exactly the rows the leg
  # is bought for and report green on the ~6000 that never needed Windows — and
  # the sixteen rows that execute that probe are recoverable verbatim from
  # commit 98bcb0d. Restore them together, and put `tests-windows` back into
  # DEFAULT_STATUS_CHECK_CONTEXTS in the same change: a required context no
  # pipeline produces is a branch nobody can merge.
  # ---------------------------------------------------------------------- #

  # ---------------------------------------------------------------------- #
  # site-build — regenerate + build the VitePress site on every PR (G3, closes
  # beadloom-wozp). The BUILD half of deploy-site (NO Pages deploy) — catches
  # VitePress/mermaid/interpolation breaks BEFORE they land on main.
  # ---------------------------------------------------------------------- #
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra languages

      - name: Reindex graph
        run: uv run beadloom reindex

      - name: Generate the site from the graph
        run: uv run beadloom docs site --out site

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build the VitePress site
        run: npm run docs:build
        working-directory: site

  # ---------------------------------------------------------------------- #
  # ai-techwriter — runs ONLY after gate + tests + site-build are green, so a
  # broken PR never spends Qwen tokens (US-1). Body copied VERBATIM from the
  # retired ai-techwriter.yml (BDL-049 model) — only the trigger moved into this
  # file + the `needs:` was added. Do NOT change the harness invocation.
  # ---------------------------------------------------------------------- #
  ai-techwriter:
    needs: [gate, tests, site-build]
    # Self-hosted VPS runner where Goose + the API key live (RFC Q5).
    runs-on: [self-hosted, ai-techwriter]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so git diff / the merge-base / the gate can read prior
          # state; check out the PR HEAD branch so the agent can commit onto it.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          # Persist a PAT (AI_TW_PAT) as the git credential `git push` uses.
          # WHY: GitHub does NOT re-trigger workflows on pushes authored by the
          # default GITHUB_TOKEN (anti-recursion) — so the agent's refresh
          # commit would NOT fire the `gate` check, leaving the required check
          # missing on the PR HEAD → unmergeable. A PAT-authored push is a
          # normal push → it triggers `gate`. The `[skip ai-techwriter]`
          # loop-guard above still stops THIS workflow re-running on that push.
          # Falls back to github.token when AI_TW_PAT is absent (variant-C:
          # PAT-less repos still check out + run, just without auto-gating).
          token: ${{ secrets.AI_TW_PAT || github.token }}

      # Loop-guard (G5): if the PR head commit is the agent's own refresh
      # (authored by beadloom-ai-techwriter OR a [skip ai-techwriter] subject),
      # skip — the agent's push must not spawn a second `synchronize` run.
      - name: Loop-guard (skip the agent's own refresh commit)
        run: |
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          if [ "$author" = "beadloom-ai-techwriter" ] || \
             printf '%s' "$subject" | grep -qF '[skip ai-techwriter]'; then
            echo "skip: PR head is the agent's own refresh commit"
            echo "AI_TW_SKIP=1" >> "$GITHUB_ENV"
          fi

      # S5 (BDL-052): enable setup-uv's built-in dependency cache so the
      # self-hosted runner skips re-downloading the wheels every PR.
      - name: Install uv
        if: env.AI_TW_SKIP != '1'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Beadloom (the substrate) + the harness deps, pinned via the lockfile.
      - name: Install Beadloom + harness deps
        if: env.AI_TW_SKIP != '1'
        run: uv sync --extra dev --extra languages

      # Goose is provisioned on the self-hosted runner image (pinned there);
      # this step asserts it is present rather than installing ad hoc.
      - name: Verify Goose is available (pinned on the runner)
        if: env.AI_TW_SKIP != '1'
        run: goose --version

      # S5 (BDL-052): cache the built index DB keyed on a hash of everything that
      # feeds it (the graph YAML + all source + all docs). On a hit the index is
      # already current for this exact tree, so the reindex below is skipped; any
      # graph/src/docs change rotates the key → miss → a full reindex runs.
      - name: Cache the Beadloom index
        if: env.AI_TW_SKIP != '1'
        id: index-cache
        uses: actions/cache@v4
        with:
          path: .beadloom/beadloom.db
          key: beadloom-index-${{ hashFiles('.beadloom/_graph/**', 'src/**', 'docs/**') }}

      # Rebuild the index so sync-check sees current code↔doc state — skipped on
      # a cache hit (the cached DB already matches this tree's hash).
      - name: Beadloom reindex
        if: env.AI_TW_SKIP != '1' && steps.index-cache.outputs.cache-hit != 'true'
        run: uv run beadloom reindex

      # PR path: --since is the merge-base of the PR base and HEAD — exactly
      # "what this PR changed" (robust when the branch is behind/ahead of base).
      # Falls back to the PR base SHA if merge-base cannot resolve. The agent
      # commits the refresh onto the PR head branch + comments on the PR.
      - name: Run AI tech-writer harness (GitHub · pr-branch)
        if: env.AI_TW_SKIP != '1' && github.event_name == 'pull_request'
        env:
          # Repository secret — never inlined; resolved only on the runner.
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # Workspace-specific MaaS endpoint (secret); falls back to the generic
          # DashScope gateway in the harness when unset.
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          # gh push + gh pr comment authenticate with the PAT so the agent's
          # refresh commit triggers the `gate` check (GITHUB_TOKEN pushes are
          # non-recursive — see the checkout token comment above). Falls back to
          # GITHUB_TOKEN when AI_TW_PAT is absent (variant-C).
          GH_TOKEN: ${{ secrets.AI_TW_PAT || secrets.GITHUB_TOKEN }}
          # The pr-branch publisher resolves the PR to comment on from this.
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          since="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
          if [ -z "$since" ]; then since="$BASE_SHA"; fi
          uv run python -m beadloom.ai_agents.ai_techwriter \
            --platform github --target pr-branch --since "$since"

      # Manual dispatch path: no PR context, so keep the branch-PR publish path
      # (cuts a doc-refresh branch + opens a PR). --since is the operator input
      # when given, else HEAD~1.
      - name: Run AI tech-writer harness (GitHub · branch-pr · manual)
        if: env.AI_TW_SKIP != '1' && github.event_name == 'workflow_dispatch'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          since="${INPUT_SINCE:-HEAD~1}"
          case "$since" in "") since="HEAD~1" ;; esac
          uv run python -m beadloom.ai_agents.ai_techwriter \
            --platform github --target branch-pr --since "$since"
