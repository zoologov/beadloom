# Mutation testing per change, and on a weekly sample of the declared scope (BDL-074 D1).
#
# THIS FILE REPLACED A WHOLE-SCOPE NIGHTLY, and the reason is a measurement. From
# BDL-068 S3.1 to 2026-09-27 one scheduled job mutated every name in
# `mutation.targets` — 6 990 mutants — against a static test pool. Ten runs were
# killed by the runner mid-queue, nine of them at queue positions 4 125-4 226, at
# 73-153 minutes depending on concurrency; the killer was never identified and the
# question was closed as superseded (`beadloom-5isv`). The whole scope does not
# fit the room, so two narrower runs replace it, and each says what it covered:
#
#   mutation-per-change (pull_request) — the functions a pull request touched in
#   the declared scope, run against the tests the binding ties to their node.
#   mutation-sample (weekly schedule, and by hand) — a seeded random sample of the
#   whole declared scope, scored with the interval the sample supports.
#
# THE WORKFLOW IS DISABLED, and was left so on purpose. The nightly was disabled
# through the API on 2026-09-27 (state `disabled_manually`); a disabled workflow
# runs neither job, on any event. Enabling it is the owner's decision, after the
# verification bead has read one run of each job:
#
#     gh workflow enable mutation.yml
#     gh workflow run mutation.yml            # one weekly sample, by hand
#
# NEITHER JOB IS A REQUIRED STATUS CHECK, and this is the sentence to read before
# adding one. The sample is scheduled and reports no check-run on a pull request,
# so a required context naming it never reports and `main` becomes unmergeable
# under `strict: true`. The per-change job does report on a pull request, and it
# is still not required: a disabled workflow reports nothing either, and its
# budget is not yet met on this repository (see below). No job name here is one
# of the nine contexts `DEFAULT_STATUS_CHECK_CONTEXTS` names, and
# `tests/self_check/config/test_mutation_ci_job.py` fails if one ever becomes one.
#
# PER CHANGE — WHAT IS SELECTED, AND THE FALLBACK. `beadloom mutation
# --changed-since` names the change's population: the functions touched in the
# declared scope, the node owning each, the test files the binding ties to that
# node, and how many test files the binding places under no node. The adapter
# (`.github/scripts/mutmut_adapter.py`) turns those functions into mutmut's EXACT
# mutant names — a glob ending `__mutmut_*` makes mutmut's clean run fall back to
# the whole selection (BDL-073) — and writes the per-run
# `pytest_add_cli_args_test_selection`: the bound tests, PLUS the old pool's files
# the binding places under no node. That second part is the fallback, and it is
# the whole selection today: when D1 landed, 0 of 464 test files were bound and
# 393 were unplaced, so every changed function runs against the coverage-derived
# pool in `pyproject.toml`. It shrinks as tests are laid out under
# `tests/{unit,integration}/` and is empty once every pool file is bound.
#
# PER CHANGE — THE BUDGET, and what is known about it. The PRD's budget is 10
# minutes on `ubuntu-latest`, and it does NOT hold while the fallback is the
# whole pool. MEASURED 2026-09-27 on a one-function change to the rule engine
# (`liveness._cycle_reasons`, Darwin arm64, 10 cores, mutmut 3.7.0): selecting
# took 496 s, nearly all of it mutmut's stats pass over the 202-file pool; the
# four exact mutants then ran in 37 s (3 killed, 1 survived); reindex, population,
# counters and score took under 10 s together. About 9 minutes locally, so about
# 15 on the runner at the nightly's measured 1.63 factor, before install. The
# stats pass shrinks with the selection, so the budget is met by laying tests
# out, not by this file. The job states its own time against the budget and warns
# when it is over; the timeout is well above the budget so that an over-budget
# run still ends with its numbers rather than being cut off.
#
# WEEKLY SAMPLE — THE SIZE IS DERIVED, not chosen, and was re-derived once it
# had been run (2026-09-27, Darwin arm64, 10 cores, mutmut 3.7.0):
#
#   budget     the job ends by about 50 minutes, under a 70-minute timeout that is
#              itself under the 73 minutes at which the nightly's runner first
#              killed it
#   fixed      ~28 minutes on the runner before the first mutant: the stats pass
#              over the pool took 469 s and 496 s in two local runs, the clean
#              run over the sampled mutants' covering tests is about the whole
#              pool (471 s run directly), both times the 1.63 runner factor the
#              nightly's first run measured (1 h 29 min against 54 min 55 s), plus
#              ~2 minutes of install and reindex; generation is 6.1 s
#   cost       18.5 s mean worst-case per mutant: the sum of the recorded durations
#              of the tests covering its function, over all 6 990 mutants, from the
#              last full stats pass (4 888 tests, 2026-09-26)
#   calibration  the nightly's queue at position 4 125 predicts 94 minutes at four
#              children from those same numbers, and the runner was killed there at
#              73-102 minutes, so runner time ~ sum(worst case) / children
#   size       (50 - 28) min x 60 s x 2 children / 18.5 s = 143, so 150 mutants
#
# At a 90% kill rate a sample of 150 gives a 95% Wilson interval of about +/-4.8
# points (200 would give +/-4.2 and does not fit the budget). The seed defaults to
# the ISO week (`2026-W40`), so a week's sample is reproducible from the commit
# and the seed alone.
#
# THE FLOOR IS HELD AGAINST THE INTERVAL for the sample: the job fails when the
# whole interval lies under 0.88, not when a point estimate does, because a sample
# of 150 from a scope at 0.89 reads under 0.88 about a third of the time. 0.88 is
# the aggregate floor calibrated on the runner in BDL-068 (95.56% there against
# 96.19% on Darwin for the same rules mutants). The per-change run is held to the
# same floor over its own mutants, where one survivor in eight is under it: that is
# the signal a per-change run exists to give.
#
# THE SILENCE HAS TWO SHAPES, and both are detected from the counters rather than
# from a status. The red shape — a step exits non-zero — reaches `needs.*.result`.
# The green shape — every step exits 0 and most mutants never ran — is invisible to
# a status, because every runner invocation carries `|| true` (mutmut exits
# non-zero whenever a mutant survives, which is a normal outcome). The adapter's
# `judge` therefore compares the counters with the names that were selected: every
# selected mutant must carry a verdict, or the run is silent and says how many
# never ran.
#
# THE SCHEDULE IS NOT PUNCTUAL. The nightly's first cron firing was created 4 h 40 m
# late; GitHub documents scheduled workflows as delayable under load.
name: Mutation

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      size:
        description: "Mutants in the sample (derived: 150, see the header)"
        required: false
        default: "150"
      seed:
        description: "Seed of the sample (default: the ISO week, e.g. 2026-W40)"
        required: false
        default: ""

concurrency:
  group: mutation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-per-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: origin/${{ github.base_ref }}
      BUDGET_SECONDS: "600"
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: >-
          uv sync --extra dev --extra languages --extra tui --extra watch
          --extra graphql --extra mutation

      - name: Build the index the binding is read from
        run: uv run beadloom reindex

      - name: State the change's population
        run: |
          uv run beadloom mutation --changed-since "$BASE" > "$RUNNER_TEMP/population.txt"
          uv run beadloom mutation --changed-since "$BASE" --json > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/population.txt"
          cat "$RUNNER_TEMP/population.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Select the mutants and the tests
        id: select
        run: >-
          uv run python .github/scripts/mutmut_adapter.py select
          --plan "$RUNNER_TEMP/plan.json"
          --names-out "$RUNNER_TEMP/names.txt"
          --github-output "$GITHUB_OUTPUT"

      - name: Run the selected mutants
        if: steps.select.outputs.mutants != '0'
        run: |
          mapfile -t names < "$RUNNER_TEMP/names.txt"
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::no mutant name was selected, and the runner given none mutates the whole declared scope"
            exit 1
          fi
          uv run mutmut run --max-children 2 "${names[@]}" || true

      - name: Count exactly the mutants that were selected
        if: steps.select.outputs.mutants != '0'
        run: >-
          uv run python .github/scripts/mutmut_adapter.py counters
          --names "$RUNNER_TEMP/names.txt"
          --stats-out mutants/change-stats.json
          --survivors-out mutants/change-survivors.json

      - name: Restore the committed pyproject.toml
        # The per-run selection is generated configuration for mutmut alone. The
        # score step reads the change from git again, and would count the rewrite
        # as a file the pull request changed.
        if: steps.select.outputs.mutants != '0'
        run: git checkout -- pyproject.toml

      - name: Score the change, with its survivors by node
        if: steps.select.outputs.mutants != '0'
        run: |
          set +e
          uv run beadloom mutation --changed-since "$BASE" \
            --stats mutants/change-stats.json \
            --survivors mutants/change-survivors.json \
            --tool "mutmut 3.7" \
            --min-score 0.88 > "$RUNNER_TEMP/score.txt"
          code=$?
          cat "$RUNNER_TEMP/score.txt"
          cat "$RUNNER_TEMP/score.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Read what the run judged
        if: always() && steps.select.outputs.mutants != '0' && steps.select.outcome == 'success'
        run: |
          uv run python .github/scripts/mutmut_adapter.py judge \
            --names "$RUNNER_TEMP/names.txt" \
            --stats mutants/change-stats.json > "$RUNNER_TEMP/verdict.txt"
          cat "$RUNNER_TEMP/verdict.txt"
          grep -qx "verdict=judged" "$RUNNER_TEMP/verdict.txt"

      - name: State the time against the budget
        if: always()
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          line="The job took ${elapsed} s from its first step; the budget is ${BUDGET_SECONDS} s on ubuntu-latest."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$BUDGET_SECONDS" ]; then
            echo "::warning::per-change mutation took ${elapsed} s, over its ${BUDGET_SECONDS} s budget"
          fi

      - name: Keep the population, the counters and the survivors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-per-change-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/names.txt
            mutants/change-stats.json
            mutants/change-survivors.json
          if-no-files-found: ignore
          retention-days: 14

  mutation-sample:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      verdict: ${{ steps.judged.outputs.verdict }}
      detail: ${{ steps.judged.outputs.detail }}
    env:
      SAMPLE_SIZE: ${{ inputs.size || '150' }}
      SAMPLE_SEED: ${{ inputs.seed }}
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: >-
          uv sync --extra dev --extra languages --extra tui --extra watch
          --extra graphql --extra mutation

      - name: Build the index the survivors are placed by
        run: uv run beadloom reindex

      - name: Draw the sample
        id: sample
        run: |
          seed="${SAMPLE_SEED:-$(date -u +%G-W%V)}"
          uv run python .github/scripts/mutmut_adapter.py sample \
            --size "$SAMPLE_SIZE" \
            --seed "$seed" \
            --names-out "$RUNNER_TEMP/sample-names.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run the sampled mutants
        run: |
          mapfile -t names < "$RUNNER_TEMP/sample-names.txt"
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::no mutant name was selected, and the runner given none mutates the whole declared scope"
            exit 1
          fi
          uv run mutmut run --max-children 2 "${names[@]}" || true

      - name: Count exactly the mutants that were sampled
        run: >-
          uv run python .github/scripts/mutmut_adapter.py counters
          --names "$RUNNER_TEMP/sample-names.txt"
          --stats-out mutants/sample-stats.json
          --survivors-out mutants/sample-survivors.json

      - name: Score the sample over the whole declared scope
        env:
          POPULATION: ${{ steps.sample.outputs.population }}
        run: >-
          uv run beadloom mutation
          --stats mutants/sample-stats.json
          --target src/beadloom/application/active_table/row_ids.py
          --target src/beadloom/application/active_table/staging.py
          --target src/beadloom/application/guards/shell_targets.py
          --target src/beadloom/application/guards/surface.py
          --target src/beadloom/application/waves/derivation.py
          --target src/beadloom/application/waves/landing.py
          --target src/beadloom/doc_sync/doc_quality.py
          --target src/beadloom/doc_sync/doc_shape.py
          --target src/beadloom/doc_sync/tables.py
          --target src/beadloom/graph/rules/
          --target src/beadloom/onboarding/role_duties.py
          --target src/beadloom/services/bd_seam/answers.py
          --target src/beadloom/services/bd_seam/assumptions.py
          --target src/beadloom/services/bd_seam/creation.py
          --target src/beadloom/services/bd_seam/invocations.py
          --sample-of "$POPULATION"
          --survivors mutants/sample-survivors.json
          --tool "mutmut 3.7"
          --min-score 0.88

      - name: Read what the run judged
        id: judged
        if: always()
        run: >-
          uv run python .github/scripts/mutmut_adapter.py judge
          --names "$RUNNER_TEMP/sample-names.txt"
          --stats mutants/sample-stats.json
          >> "$GITHUB_OUTPUT"

      - name: State the time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          line="The job took ${elapsed} s for a sample of ${SAMPLE_SIZE}."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the sample, the counters and the survivors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-sample-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sample-names.txt
            mutants/sample-stats.json
            mutants/sample-survivors.json
            mutants/**/*.meta
          if-no-files-found: ignore
          retention-days: 14

  # THE ANNOUNCEMENT. A separate job rather than a final step, for two reasons
  # that are both about what it can still do when the sample job cannot.
  #
  #   A step cannot speak for a job that was killed. `timeout-minutes` and the
  #   `concurrency` block above both END the job; a step guarded by
  #   `if: always()` is not guaranteed to run through either. A dependent job
  #   reads `needs.mutation-sample.result` as `failure` or `cancelled` and runs
  #   anyway, which covers the two shapes where the run reports the least.
  #
  #   And `issues: write` stays off the job that executes mutated code. The
  #   runner imports `mutants/src/beadloom`, whose bodies were rewritten by a
  #   generator; the smallest job that needs the token is the one that should
  #   carry it. The file's top-level grant stays `contents: read`.
  #
  # A pull request's run is not announced here: its red is on the pull request.
  announce:
    needs: mutation-sample
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Say it where it is seen, once per outage and not once per week
        # NINE IDENTICAL ISSUES ARE THE SAME SILENCE IN A LOUDER FORM, so there
        # is one issue and it is found by LABEL. The label survives a retitling,
        # where a marker in the title does not, and `gh label create --force` is
        # idempotent — the label need not exist before the first failure. While
        # an issue carrying it is open, each further week adds a comment naming
        # that week's cause and its run; the comment count is then the length of
        # the outage.
        #
        # The owner is @-mentioned rather than assigned: a mention notifies
        # whether or not they watch all activity, and an invalid assignee would
        # fail this step under `set -e` and take the announcement with it.
        #
        # A run that judges its sample CLOSES the open issue instead of staying
        # quiet. A watch issue left open after the thing it watches recovered is
        # a second silence, of the kind that gets muted.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          WATCH_LABEL: mutation-weekly
          WATCH_TITLE: "Mutation weekly sample: no verdict"
          RESULT: ${{ needs.mutation-sample.result }}
          VERDICT: ${{ needs.mutation-sample.outputs.verdict }}
          DETAIL: ${{ needs.mutation-sample.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create "$WATCH_LABEL" -R "$REPO" --force \
            --color "B60205" \
            --description "The weekly mutation sample reached no verdict"

          number="$(gh issue list -R "$REPO" --state open \
            --label "$WATCH_LABEL" --limit 50 --json number \
            --jq '.[0].number // empty')"

          if [ "$RESULT" = "success" ] && [ "$VERDICT" = "judged" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" -R "$REPO" --body \
                "The weekly sample reached a verdict again: ${DETAIL:-no detail}. Run: $RUN_URL"
              gh issue close "$number" -R "$REPO" --reason completed
            fi
            echo "the weekly sample judged every mutant it drew; nothing to announce"
            exit 0
          fi

          if [ -n "${DETAIL:-}" ]; then
            cause="$DETAIL"
          else
            cause="the job did not reach the step that reads its counters"
          fi

          body="$(printf '%s\n' \
            "@$OWNER — the weekly mutation sample reached no verdict, or one under its floor." \
            "" \
            "- **Job result:** \`$RESULT\`" \
            "- **What the counters say:** $cause" \
            "- **Run:** $RUN_URL" \
            "" \
            "This issue is the one place the weekly sample speaks through: while it" \
            "is open, each further failed week adds a comment here instead of a new" \
            "issue, and the first run that judges its sample closes it.")"

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --label "$WATCH_LABEL" \
              --title "$WATCH_TITLE" --body "$body"
          fi
