  # BDL-076 A3 (`beadloom-7091`): one node per Feature-Sliced Design slice of the
  # site theme. The slice carries its FSD layer as a tag, and `site-fsd-layers` in
  # rules.yml judges its imports against the layer order.
nodes:
  - ref_id: site-node-card
    kind: component
    summary: "The node card: identity, layer, source linked to the repository, docs with their freshness, bound tests, public symbols, edges by kind, rule findings, activity, debt, the node's page and the ctx and why commands to copy"
    source: site/.vitepress/theme/widgets/node-card/
    tags: [fsd-widgets]
    # The browser tests that drive this slice (BDL-076 R1 finding m5). Declared
    # here, a spec binds to this slice rather than to `vitepress-site`'s prefix.
    tests:
      - site/e2e/card.spec.js
    docs:
      - docs/services/vitepress-site/node-card.md
edges:
  - src: site-node-card
    dst: vitepress-site
    kind: part_of
