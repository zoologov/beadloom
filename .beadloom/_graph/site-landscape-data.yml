  # BDL-076 A2 (`beadloom-iehv`): one node per Feature-Sliced Design slice of the
  # site theme. The slice carries its FSD layer as a tag, and `site-fsd-layers` in
  # rules.yml judges its imports against the layer order.
nodes:
  - ref_id: site-landscape-data
    kind: component
    summary: "The landscape data file as the landscape map reads it"
    source: site/.vitepress/theme/entities/landscape-data/
    tags: [fsd-entities]
    docs:
      - docs/services/vitepress-site/landscape-data.md
edges:
  - src: site-landscape-data
    dst: vitepress-site
    kind: part_of
