nodes:
  # Root service
  - ref_id: beadloom
    kind: service
    summary: "Beadloom CLI + MCP server — architecture graph, Context Oracle, Doc Sync Engine, architecture rules and the Gate (v3.0.2)"
    source: src/beadloom/
    docs:
      - docs/architecture.md
      - docs/getting-started.md
      - docs/guides/ci-setup.md

  # Domain: Context Oracle
  - ref_id: context-oracle
    kind: domain
    summary: "Context bundle building via BFS graph traversal, code indexing, caching, search"
    source: src/beadloom/context_oracle/
    tags: [layer-domain]
    docs:
      - docs/domains/context-oracle/README.md

  # Domain: Doc Sync
  - ref_id: doc-sync
    kind: domain
    summary: "Doc-code synchronization tracking and stale detection"
    source: src/beadloom/doc_sync/
    tags: [layer-domain]
    docs:
      - docs/domains/doc-sync/README.md

  # Domain: Graph
  - ref_id: graph
    kind: domain
    summary: "YAML graph format, loader, diff, rule engine, import resolver, linter"
    source: src/beadloom/graph/
    tags: [layer-domain]
    docs:
      - docs/domains/graph/README.md

  # Domain: Onboarding
  - ref_id: onboarding
    kind: domain
    summary: "Project bootstrap, doc import, architecture-aware presets, doc generation"
    source: src/beadloom/onboarding/
    tags: [layer-domain]
    docs:
      - docs/domains/onboarding/README.md

  # Feature: Doc Generator
  - ref_id: doc-generator
    kind: feature
    summary: "Doc skeleton generation + AI polish data from architecture graph"
    source: src/beadloom/onboarding/doc_generator.py
    docs:
      - docs/domains/onboarding/features/doc-generator/SPEC.md

  # Feature: Doc Templates (BDL-061 S4b) — the shape of a generated document,
  # out of the generator's string literals and into composable package data.
  - ref_id: doc-templates
    kind: feature
    summary: "Composed document templates: render a skeleton and derive the sections it requires"
    source: src/beadloom/onboarding/doc_templates.py
    docs:
      - docs/domains/onboarding/features/doc-templates/SPEC.md

  # Domain: Infrastructure
  - ref_id: infrastructure
    kind: domain
    summary: "Domain-agnostic SQLite database layer, health metrics, git activity"
    source: src/beadloom/infrastructure/
    tags: [layer-infra]
    docs:
      - docs/domains/infrastructure/README.md

  # Application: use-case orchestration layer
  - ref_id: application
    kind: domain
    summary: "Use-case orchestration: reindex, doctor, debt report, file watcher"
    source: src/beadloom/application/
    tags: [layer-application]
    docs:
      - docs/domains/application/README.md

  # Domain: AI Agents (governed AI-agent harnesses, shipped in the wheel)
  - ref_id: ai_agents
    kind: domain
    summary: "Governed AI-agent harnesses (Goose + model) over Beadloom read APIs + bd/beadloom shells; ships in the package"
    source: src/beadloom/ai_agents/
    tags: [layer-domain]
    docs:
      - docs/domains/ai_agents/README.md

  # Feature: AI Tech-Writer (the deterministic doc-refresh harness)
  - ref_id: ai-techwriter
    kind: feature
    summary: "Deterministic, seam-isolated PR-triggered doc-refresh harness (discover drift -> packet -> agent -> fixpoint -> gate -> publish; verdict ok/flagged/infra)"
    source: src/beadloom/ai_agents/ai_techwriter/
    docs:
      - docs/domains/ai_agents/features/ai-techwriter/SPEC.md

  # Service: CLI
  - ref_id: cli
    kind: service
    summary: "Click-based CLI — registration shell wiring the services/commands/ groups"
    source: src/beadloom/services/cli.py
    tags: [layer-service]
    docs:
      - docs/services/cli.md

  # Component: CLI command groups (BDL-059 S4 cohesion split of the cli monolith).
  # Dir-source covers every module under services/commands/ for module-coverage.
  - ref_id: cli-commands
    kind: component
    summary: "Cohesive Click command groups: query, index_ops, status, docsync, federation, docs, setup, dashboard, snapshot"
    source: src/beadloom/services/commands/
    tags: [layer-service]
    docs:
      - docs/services/components/cli-commands/DOC.md

  # Component: the concrete read-only probes the flow guards read the world
  # through (bd + git). In the SERVICES layer because the bd seam is, and the
  # application layer must not import services.
  - ref_id: guard-probes
    kind: component
    summary: "Concrete read-only guard probes over the real bd (claimed beads) and git (current branch)"
    source: src/beadloom/services/guard_probes.py
    tags: [layer-service]
    docs:
      - docs/services/components/guard-probes/DOC.md

  # Service: MCP Server
  - ref_id: mcp-server
    kind: service
    summary: "MCP stdio server with 18 tools for AI agents"
    source: src/beadloom/services/mcp_server.py
    tags: [layer-service]
    docs:
      - docs/services/mcp.md

  # Service: TUI
  - ref_id: tui
    kind: service
    summary: "Interactive 3-screen architecture workstation with dashboard, explorer, doc status"
    source: src/beadloom/tui/
    tags: [layer-service]
    docs:
      - docs/services/tui.md

  # Feature: Doctor
  - ref_id: doctor
    kind: feature
    summary: "Validation checks for graph and data integrity"
    source: src/beadloom/application/doctor.py
    docs:
      - docs/domains/application/features/doctor/SPEC.md

  # Feature: Why (Impact Analysis)
  - ref_id: why
    kind: feature
    summary: "Impact analysis — upstream deps and downstream consumers via bidirectional BFS"
    source: src/beadloom/context_oracle/why.py
    docs:
      - docs/domains/context-oracle/features/why/SPEC.md

  # Feature: Watcher
  - ref_id: watcher
    kind: feature
    summary: "File watcher for auto-reindex on changes"
    source: src/beadloom/application/watcher.py
    docs:
      - docs/domains/application/features/watcher/SPEC.md

  # Feature: Status (data-gathering for `beadloom status`; BDL-059 S4)
  - ref_id: status
    kind: feature
    summary: "Status data-gathering — index/coverage/health/trend counts + context-bundle metrics for the status command"
    source: src/beadloom/application/status.py
    docs:
      - docs/domains/application/features/status/SPEC.md

  # Feature: Search
  - ref_id: search
    kind: feature
    summary: "FTS5 full-text search across nodes and documentation"
    source: src/beadloom/context_oracle/search.py
    docs:
      - docs/domains/context-oracle/features/search/SPEC.md

  # Feature: Graph Diff
  - ref_id: graph-diff
    kind: feature
    summary: "Git ref comparison — added/removed/changed nodes and edges"
    source: src/beadloom/graph/diff.py
    docs:
      - docs/domains/graph/features/graph-diff/SPEC.md

  # Feature: Rule Engine (rules/ package — see SPEC; rule_engine.py is the
  # back-compat re-export shim, annotated to the `graph` domain).
  - ref_id: rule-engine
    kind: feature
    summary: "Architecture-as-Code rule engine (rules/ package: types, loader, evaluators, cycles)"
    source: src/beadloom/graph/rules/
    docs:
      - docs/domains/graph/features/rule-engine/SPEC.md

  # Feature: Scenario Binding (BDL-061 S4) — reads the acceptance suite and the
  # documents that reference it; the rule engine turns that into verdicts.
  - ref_id: scenario-binding
    kind: feature
    summary: "Read .feature files and doc references: which node and which bead a scenario binds to"
    source: src/beadloom/graph/scenarios.py
    docs:
      - docs/domains/graph/features/scenario-binding/SPEC.md

  # Feature: Import Resolver
  - ref_id: import-resolver
    kind: feature
    summary: "Multi-language import analysis and depends_on edge generation"
    source: src/beadloom/graph/import_resolver.py
    docs:
      - docs/domains/graph/features/import-resolver/SPEC.md

  # Feature: C4 Architecture Diagrams
  - ref_id: c4-diagrams
    kind: feature
    summary: "C4 architecture model mapping with Mermaid and PlantUML renderers"
    source: src/beadloom/graph/c4.py
    docs:
      - docs/domains/graph/features/c4-diagrams/SPEC.md

  # Feature: Federation (federation/ package — see SPEC; __init__.py is the
  # back-compat re-export hub and remains this node's nominal source file).
  - ref_id: federation
    kind: feature
    summary: "Cross-repo federation (federation/ package: refs, export, reconcile, gate)"
    source: src/beadloom/graph/federation/
    docs:
      - docs/domains/graph/features/federation/SPEC.md

  # Feature: Cache
  - ref_id: cache
    kind: feature
    summary: "ETag-based context bundle cache (in-memory + SQLite)"
    source: src/beadloom/context_oracle/cache.py
    docs:
      - docs/domains/context-oracle/features/cache/SPEC.md

  # Feature: Agent Prime
  - ref_id: agent-prime
    kind: feature
    summary: "Cross-IDE context injection via prime CLI/MCP + AGENTS.md + IDE adapters"
    source: src/beadloom/onboarding/scanner/
    docs:
      - docs/domains/onboarding/features/agent-prime/SPEC.md

  # Feature: Debt Report (debt_report/ package — see SPEC). Sourced at the
  # PACKAGE: a node's source names a SCOPE, and the facade only re-exports.
  - ref_id: debt-report
    kind: feature
    summary: "Architecture debt aggregation, scoring, trend tracking, and CI gating (debt_report/ package: models, config, collect, scoring, trend, render)"
    source: src/beadloom/application/debt_report/
    docs:
      - docs/domains/application/features/debt-report/SPEC.md

  # Feature: Reindex (reindex/ package — decomposed by cohesion in BDL-059 S4:
  # models / rules_loader / indexing / enrichment / sync_state / change_detection
  # / full / incremental. The package __init__ is this node's source and re-exports
  # the stable public + back-compat surface.)
  - ref_id: reindex
    kind: feature
    summary: "Full + incremental reindex pipeline (reindex/ package: models, indexing, enrichment, sync-state, change-detection, full, incremental)"
    source: src/beadloom/application/reindex/
    docs:
      - docs/domains/application/features/reindex/SPEC.md

  # Feature: Docs Audit
  - ref_id: docs-audit
    kind: feature
    summary: "Zero-config meta-doc staleness detection via keyword-proximity matching"
    source: src/beadloom/doc_sync/audit.py
    docs:
      - docs/domains/doc-sync/features/docs-audit/SPEC.md

  # === BDL-051 S3b (BEAD-14): full module-coverage classification ===

  # --- Features (capabilities with a SPEC.md) ---

  - ref_id: code-indexer
    kind: feature
    summary: "Tree-sitter code symbol indexer — parses src into symbols + extracts beadloom annotations"
    source: src/beadloom/context_oracle/code_indexer.py
    docs:
      - docs/domains/context-oracle/features/code-indexer/SPEC.md

  - ref_id: route-extraction
    kind: feature
    summary: "API route extraction — tree-sitter AST + regex fallback across 12 web frameworks"
    source: src/beadloom/context_oracle/route_extractor.py
    docs:
      - docs/domains/context-oracle/features/route-extraction/SPEC.md

  - ref_id: test-mapping
    kind: feature
    summary: "Test mapping — detect test frameworks and map test files to the source nodes they cover"
    source: src/beadloom/context_oracle/test_mapper.py
    docs:
      - docs/domains/context-oracle/features/test-mapping/SPEC.md

  - ref_id: sync-check
    kind: feature
    summary: "Doc-code sync engine — symbols_hash freshness state, stale detection, mark-synced baselining"
    source: src/beadloom/doc_sync/engine.py
    docs:
      - docs/domains/doc-sync/features/sync-check/SPEC.md

  # Feature: Doc Shape (BDL-061 S4b) — the structural half of freshness. Every
  # other sync reason compares CONTENT; this one compares the document's shape
  # against the sections its kind requires.
  - ref_id: doc-shape
    kind: feature
    summary: "Document structure check — sections a document's peers carry and this one lost"
    source: src/beadloom/doc_sync/doc_shape.py
    docs:
      - docs/domains/doc-sync/features/doc-shape/SPEC.md

  # Feature: the `## Axes` section's grammar (BDL-068 S1.4). One home for what
  # the section says, read by the checks and written by `impact --section`, so
  # the writer and the reader cannot drift into two shapes with one name.
  - ref_id: axes-section
    kind: feature
    summary: "The `## Axes` section of a work item's document: the seed it names, the scope decision it records, and the bead `refs:` generated from it"
    source: src/beadloom/doc_sync/axes_section.py
    docs:
      - docs/domains/doc-sync/features/axes-section/SPEC.md

  # Feature: the route a work item took, checked against the axes it was decided
  # from (BDL-068 S1.5). The unit is the work-item FOLDER, not the document.
  - ref_id: work-item-type
    kind: feature
    summary: "The route a work item took, checked against the axes it was decided from: no axes on the route that skips scope approval, and kept axes naming more nodes than that route holds"
    source: src/beadloom/doc_sync/work_item_type.py
    docs:
      - docs/domains/doc-sync/features/work-item-type/SPEC.md

  # Feature: the paths a commit stages, judged against the axes its work item
  # declared (BDL-068 S1.6). Pure: paths, a declared scope and an ownership map
  # in, a verdict out — the git and index halves are `declared-scope`'s.
  - ref_id: scope-check
    kind: feature
    summary: "The paths a commit stages, judged against the axes its work item declared: a node an axis rules out of scope, or a bounded context no declared axis reaches"
    source: src/beadloom/doc_sync/scope_check.py
    docs:
      - docs/domains/doc-sync/features/scope-check/SPEC.md

  # Feature: Doc Quality (BDL-061 S4b) — the writing standard, read back.
  - ref_id: doc-quality
    kind: feature
    summary: "Five writing-standard checks over planning documents: measurable goal, decision reason, risk mitigation, no pending question in an approved document, no unfilled placeholder"
    source: src/beadloom/doc_sync/doc_quality.py
    docs:
      - docs/domains/doc-sync/features/doc-quality/SPEC.md

  - ref_id: snapshot
    kind: feature
    summary: "Architecture snapshot store — save, list, and compare graph states over time"
    source: src/beadloom/graph/snapshot.py
    docs:
      - docs/domains/graph/features/snapshot/SPEC.md

  - ref_id: ci-gate
    kind: feature
    summary: "Unified CI gate (`beadloom ci`) — one convergence point composing reindex/lint/sync-check/config-check/doctor/federate into a single verdict"
    source: src/beadloom/application/gate.py
    docs:
      - docs/domains/application/features/ci-gate/SPEC.md

  # Feature: `beadloom impact` — what a change touches, answered from the source
  # over a seed the command DERIVES from the target. BDL-068 S1.2; the measurement
  # that made seed derivation the first criterion is BDL-068 S1.3's, at af26750d.
  - ref_id: impact
    kind: feature
    summary: "Who else commits through this sink, who else calls this, how many branches and exit forms the command has, over a seed derived from the target and named in the answer"
    source: src/beadloom/application/impact/
    docs:
      - docs/domains/application/features/impact/SPEC.md

  - ref_id: flow-guards
    kind: feature
    summary: "Named-guard primitive: registry, verdict {pass|warn|block|skip}, strictness + exclusions from flow.yml, firing record + liveness"
    source: src/beadloom/application/guards/
    docs:
      - docs/domains/application/features/flow-guards/SPEC.md

  # Feature: the wave decision (BDL-061 S6). The graph is the only place that
  # holds code-level interdependence, so it is the only place a wave shape can be
  # DECIDED rather than guessed.
  - ref_id: wave-plan
    kind: feature
    summary: "Decide which beads may run at once from the code-level independence of their node scopes, and state the media a wave shares regardless"
    source: src/beadloom/application/waves/
    docs:
      - docs/domains/application/features/wave-plan/SPEC.md

  # Feature: what a reviewer is handed (BDL-061 S6). A review that reads what the
  # author said it did is not an independent check — hidden-profile groups scored
  # 17-36% against ~100% for a single holder of all the facts (BDL-UX #155 C).
  - ref_id: review-brief
    kind: feature
    summary: "Assemble a reviewer's input from the change and the specification, count the author's comments rather than print them, and release them once a verdict is recorded"
    source: src/beadloom/application/review_brief/
    docs:
      - docs/domains/application/features/review-brief/SPEC.md

  - ref_id: graph-reads
    kind: feature
    summary: "Application read facade over the infrastructure repository — lets the TUI read the graph index without a presentation->infrastructure import"
    source: src/beadloom/application/graph_reads.py
    docs:
      - docs/domains/application/features/graph-reads/SPEC.md

  - ref_id: config-check
    kind: feature
    summary: "AgentConfigAsCode — drift detection (and --fix) for generated agent-config artifacts (AGENTS.md, CLAUDE.md auto-blocks, IDE adapters)"
    source: src/beadloom/onboarding/config_sync.py
    docs:
      - docs/domains/onboarding/features/config-check/SPEC.md

  - ref_id: ai-techwriter-setup
    kind: feature
    summary: "`setup-ai-techwriter` — scaffold the packaged AI tech-writer harness (CI workflow + recipe + guide) into any repo; no vendoring"
    source: src/beadloom/onboarding/ai_techwriter_setup.py
    docs:
      - docs/domains/onboarding/features/ai-techwriter-setup/SPEC.md

  - ref_id: branch-protection
    kind: feature
    summary: "`setup-branch-protection` — idempotent main branch-protection (PR-required + ci.yml required status checks)"
    source: src/beadloom/onboarding/branch_protection.py
    docs:
      - docs/domains/onboarding/features/branch-protection/SPEC.md

  - ref_id: agentic-flow-setup
    kind: feature
    summary: "`setup-agentic-flow` — scaffold Beadloom's proven multi-agent dev flow (agents/commands templates, vendored 1:1 + drift-guard) into any repo"
    source: src/beadloom/onboarding/agentic_flow_setup.py
    docs:
      - docs/domains/onboarding/features/agentic-flow-setup/SPEC.md

  - ref_id: flow-config
    kind: feature
    summary: "`.beadloom/flow.yml` schema + loader (FlowConfig) — declares tools/architecture/stack/quality for the role configurator; strict validation + auto-detect/resolve defaults"
    source: src/beadloom/onboarding/flow_config.py
    docs:
      - docs/domains/onboarding/features/flow-config/SPEC.md

  - ref_id: role-composer
    kind: feature
    summary: "compose_role — assembles a role file from CORE + one architecture overlay (ddd/fsd) + stack overlays (python/fastapi/js/ts/vue), deterministically ordered"
    source: src/beadloom/onboarding/role_composer.py
    docs:
      - docs/domains/onboarding/features/role-composer/SPEC.md

  - ref_id: role-adapters
    kind: feature
    summary: "generate_adapters — writes per-tool role adapter sets (.claude/agents/*, .cursor/agents/* + Cursor orchestrator) from composed roles; the drift-guard's single writer"
    source: src/beadloom/onboarding/role_adapters.py
    docs:
      - docs/domains/onboarding/features/role-adapters/SPEC.md

  - ref_id: role-duties
    kind: feature
    summary: "duty_report — the duties a composed flow declares, checked in both directions against the composed core of every role each one names"
    source: src/beadloom/onboarding/role_duties.py
    docs:
      - docs/domains/onboarding/features/role-duties/SPEC.md

  - ref_id: flow-composer
    kind: feature
    summary: "compose(core, architecture, stack, project) — the one layered assembly behind role files, slash commands and CLAUDE.md; the project layer lives in .beadloom/flow/"
    source: src/beadloom/onboarding/composer.py
    docs:
      - docs/domains/onboarding/features/flow-composer/SPEC.md

  - ref_id: flow-suppression
    kind: feature
    summary: "a declared stand-down of a shipped core rule — reason + exit condition mandatory, appended as a visible notice rather than applied as a deletion"
    source: src/beadloom/onboarding/flow_suppression.py
    docs:
      - docs/domains/onboarding/features/flow-suppression/SPEC.md

  - ref_id: flow-manifest
    kind: feature
    summary: "records the sha256 of every composed artifact Beadloom writes, so a later run tells its own output (recomposable) from a hand edit (reported, never rewritten)"
    source: src/beadloom/onboarding/flow_manifest.py
    docs:
      - docs/domains/onboarding/features/flow-manifest/SPEC.md

  - ref_id: site-generation
    kind: feature
    summary: "`docs site` — generate the VitePress content tree from the indexed graph (About/architecture/per-node pages, dashboard, landscape, nav, mermaid guard)"
    source: src/beadloom/application/site.py
    docs:
      - docs/domains/application/features/site-generation/SPEC.md

  # --- Components (internal/infra building blocks with a DOC.md) ---

  - ref_id: graph-files
    kind: component
    summary: "One skip policy for every reader of .beadloom/_graph/ — name, parse and mapping guards in one body"
    source: src/beadloom/onboarding/graph_files.py
    docs:
      - docs/domains/onboarding/components/graph-files/DOC.md

  - ref_id: graph-loader
    kind: component
    summary: "YAML graph parser + SQLite loader — reads .beadloom/_graph/*.yml into the nodes/edges tables"
    source: src/beadloom/graph/loader.py
    docs:
      - docs/domains/graph/components/graph-loader/DOC.md

  - ref_id: contracts
    kind: component
    summary: "First-class cross-service contract model + protocol-agnostic reconciliation (contract_key, ContractVerdict)"
    source: src/beadloom/graph/contracts.py
    docs:
      - docs/domains/graph/components/contracts/DOC.md

  - ref_id: sdl
    kind: component
    summary: "Minimal dependency-free GraphQL SDL surface extractor for the cross-service contract graph"
    source: src/beadloom/graph/sdl.py
    docs:
      - docs/domains/graph/components/sdl/DOC.md

  - ref_id: graphql_surface
    kind: component
    summary: "Typed GraphQL Tier-A surface extraction (queries/mutations/subscriptions; field types + nullability/list + args) via the optional graphql-core extra, honest name-level fallback"
    source: src/beadloom/graph/graphql_surface.py
    docs:
      - docs/domains/graph/components/graphql_surface/DOC.md

  - ref_id: graphql_breaking
    kind: component
    summary: "Native typed GraphQL breaking analysis — names consumer references the producer breaks (absent / type-narrowed / nullability / arg break); additive changes benign"
    source: src/beadloom/graph/graphql_breaking.py
    docs:
      - docs/domains/graph/components/graphql_breaking/DOC.md

  - ref_id: amqp_body
    kind: component
    summary: "Strict AMQP message-body JSON-Schema model + native body-diff — names consumer-read fields the producer body breaks (absent / type-incompatible / required-narrowed / nested+array); additive changes benign"
    source: src/beadloom/graph/amqp_body.py
    docs:
      - docs/domains/graph/components/amqp_body/DOC.md

  - ref_id: asyncapi
    kind: component
    summary: "Source-only AsyncAPI ingestion adapter — extracts a message payload JSON-Schema (2.x/3.x) into the internal AMQP body model; honest degradation to None when absent"
    source: src/beadloom/graph/asyncapi.py
    docs:
      - docs/domains/graph/components/asyncapi/DOC.md

  - ref_id: context-builder
    kind: component
    summary: "Context bundle builder — BFS subgraph traversal + bundle assembly for ctx/prime"
    source: src/beadloom/context_oracle/builder.py
    docs:
      - docs/domains/context-oracle/components/context-builder/DOC.md

  # Component: the intent half of a context bundle (BDL-061 `.87`). Pure policy —
  # which recorded intent belongs to a node, and which of the three answers a
  # bundle carries. No filesystem, so the port types live here and the adapter
  # that fills them lives one layer up.
  - ref_id: node-intent
    kind: component
    summary: "Decide which recorded intent a node's context bundle carries, and keep 'nobody declared it' apart from 'nobody looked'"
    source: src/beadloom/context_oracle/intent.py
    docs:
      - docs/domains/context-oracle/components/node-intent/DOC.md

  # Component: the shape a project's documents are held to (BDL-061 S4b). Joins
  # onboarding's composed templates to doc-sync's checks, which are peer domains.
  # Component: one composition of every planning-document check (BDL-068 S1.4).
  # The Gate step and the `docs quality` command each assembled the run before
  # this; two assemblies of one report can disagree about what was checked.
  - ref_id: planning-report
    kind: component
    summary: "One composition of every check that reads a planning document, so the Gate and the CLI report the same run"
    source: src/beadloom/application/planning_report.py
    docs:
      - docs/domains/application/components/planning-report/DOC.md

  - ref_id: doc-shape-requirements
    kind: component
    summary: "Resolve required document sections and the shipped placeholder vocabulary for a project"
    source: src/beadloom/application/doc_shape.py
    docs:
      - docs/domains/application/components/doc-shape-requirements/DOC.md

  # Component: the routes `/task-init` declares, derived from the composed
  # command rather than restated in Python (BDL-068 S1.5).
  - ref_id: work-item-routing
    kind: component
    summary: "The work-item types, their flows and the documents each writes, derived from the composed /task-init command"
