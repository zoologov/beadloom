  # BDL-076 A2 (`beadloom-iehv`): one node per Feature-Sliced Design slice of the
  # site theme. The slice carries its FSD layer as a tag, and `site-fsd-layers` in
  # rules.yml judges its imports against the layer order.
nodes:
  - ref_id: site-graph-edges
    kind: component
    summary: "The edge kinds the viewer draws, their line styles, the legend derived from the drawn edges, and the edges a walk follows"
    source: src/beadloom/site_scaffold/.vitepress/theme/entities/graph-edges/
    tags: [fsd-entities]
    # The browser tests that drive this slice (BDL-076 R1 finding m5). Declared
    # here, a spec binds to this slice rather than to `vitepress-site`'s prefix.
    tests:
      - src/beadloom/site_scaffold/e2e/edges.spec.js
    docs:
      - docs/services/vitepress-site/graph-edges.md
edges:
  - src: site-graph-edges
    dst: vitepress-site
    kind: part_of
