  # BDL-076 A2 (`beadloom-iehv`): one node per Feature-Sliced Design slice of the
  # site theme. The slice carries its FSD layer as a tag, and `site-fsd-layers` in
  # rules.yml judges its imports against the layer order.
nodes:
  - ref_id: site-filter-graph
    kind: component
    summary: "Which nodes the graph viewer shows: kind, domain subtree, layer, flagged-only and search, with the containers of every shown node kept"
    source: site/.vitepress/theme/features/filter-graph/
    tags: [fsd-features]
    # The browser tests that drive this slice (BDL-076 R1 finding m5). Declared
    # here, a spec binds to this slice rather than to `vitepress-site`'s prefix.
    tests:
      - site/e2e/filters.spec.js
    docs:
      - docs/services/vitepress-site/filter-graph.md
edges:
  - src: site-filter-graph
    dst: vitepress-site
    kind: part_of
