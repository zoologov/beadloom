  # BDL-076 A2 (`beadloom-iehv`): one node per Feature-Sliced Design slice of the
  # site theme. The slice carries its FSD layer as a tag, and `site-fsd-layers` in
  # rules.yml judges its imports against the layer order.
nodes:
  - ref_id: site-architecture-data
    kind: component
    summary: "The architecture data file as the viewer reads it, refused with a message when its schema version is unknown"
    source: site/.vitepress/theme/entities/architecture-data/
    tags: [fsd-entities]
    # The browser tests that drive this slice (BDL-076 R1 finding m5). Declared
    # here, a spec binds to this slice rather than to `vitepress-site`'s prefix.
    tests:
      - site/e2e/data-version.spec.js
    docs:
      - docs/services/vitepress-site/architecture-data.md
edges:
  - src: site-architecture-data
    dst: vitepress-site
    kind: part_of
