            - "tests/acceptance/features/gate_finding_owner.feature"
            - "tests/acceptance/features/gate_not_run.feature"
            - "tests/acceptance/features/ignore_block_drift.feature"
            - "tests/acceptance/features/impact.feature"
            - "tests/acceptance/features/init_skeleton_carries_public_api.feature"
            - "tests/acceptance/features/init_skeleton_names_modules.feature"
            - "tests/acceptance/features/mutation_runs_on_a_change_or_on_a_sample.feature"
            - "tests/acceptance/features/mutation_scope.feature"
            - "tests/acceptance/features/polish_symbols_under_source.feature"
            - "tests/acceptance/features/readme_pair_gate.feature"
            - "tests/acceptance/features/remediation_that_can_be_followed.feature"
            - "tests/acceptance/features/room_environment.feature"
            - "tests/acceptance/features/routes_under_source.feature"
            - "tests/acceptance/features/scaffold_edit_policy.feature"
            - "tests/acceptance/features/sibling_baseline.feature"
            - "tests/acceptance/features/stale_pairs_on_every_surface.feature"
            - "tests/acceptance/features/test_files_bind_to_the_node_their_path_mirrors.feature"
            - "tests/acceptance/features/verdict_room.feature"
            - "tests/acceptance/features/version_subject.feature"
            - "tests/acceptance/features/wave_running_work.feature"
          reason: >-
            B3 measured each of these against the suite map's coverage run and did
            not move it: its tag names a node its steps execute but not as the
            primary one, a tag the map did not measure because a sibling feature
            matched the step file, or it was written after the map. Placing it by
            its tag would move a disagreement into a folder instead of resolving
            it. B3 listed 40; E1 (`beadloom-cs2o`) moved the rule engine's 7, and
            F3 (`beadloom-2mj3.8`) resolved the 3 whose tag named a node their
            steps never execute and removed one feature that restated three
            self-checks, so 29 remain.
          until: >-
            the feature is rewritten against the node its steps execute and moved
            to that node's folder -- E1 (`beadloom-cs2o`) for the rule engine's,
            follow-up slices of BDL-074 for the rest
