  # The node leg, held apart so it can be `warn` while the file leg is `error`.
  # WARN, AND WHY: measured 2026-09-28, 20 of the 51 features have no bound test
  # file of their own or of a part of them (19 after E1 bound tests to ci-gate;
  # 17 after F2 bound tests to reindex and test-mapping, measured by
  # `lint --strict --format json` on 2026-09-28).
  # While 167 files are unplaced (after G3), any of
  # them may test such a node, so "no bound test" is not "untested" and cannot be
  # an error. Nor can it be exempted honestly: an exemption would claim to know
  # the node is untested for a reason, and nobody knows that yet. Each finding
  # says how many files bind to no node. Acceptance scenarios are not counted
  # here -- they are `scenario-coverage`'s population.
  - name: features-have-bound-tests
    description: "A feature node has a bound test file, its own or a part's"
    severity: warn
    test_binding:
      for: { kind: feature }

  # A unit test of a node in the domain layer (the node, or a container of it,
  # tagged `layer-domain`) does not import the infrastructure layer: testing
  # through an index is what an integration test does. `forbid_import`'s own
  # evaluator, run over the imports C1 records for test files -- which keep an
  # aliased `import a as b` that the code-import index drops. Measured
  # 2026-09-28: 27 of the 47 unit test files are bound to a domain-layer node, 4
  # of them import `beadloom.infrastructure.db`, listed below.
  - name: domain-unit-tests-import-no-infrastructure
    description: "A unit test of a domain-layer node does not import the infrastructure layer"
    severity: error
    test_import_boundary:
      from: "tests/unit/**"
      to: "beadloom/infrastructure/**"
      of: { tag: layer-domain }
      exempt:
        - from: "tests/unit/doc_sync/audit/test_tolerance.py"
          to: "beadloom/infrastructure/db"
          reason: &unit-test-opens-an-index >-
            Builds its fixture in a SQLite index through `infrastructure.db`, which is
            what an integration test does; B2 placed it under unit/ by the kind the
            suite map measured for it, and the map could not see the index it opens.
          until: &unit-test-opens-an-index-exit >-
            the file (or the part of it that opens an index) moves to
            tests/integration/ by the mirror, or its fixture is built without an index
        - from: "tests/unit/graph/contracts/test_federate_f2_gate.py"
          to: "beadloom/infrastructure/db"
          reason: *unit-test-opens-an-index
          until: *unit-test-opens-an-index-exit
        - from: "tests/unit/graph/test_linter.py"
          to: "beadloom/infrastructure/db"
          reason: *unit-test-opens-an-index
          until: *unit-test-opens-an-index-exit
        - from: "tests/unit/onboarding/scanner/test_a_stale_count_names_its_population.py"
          to: "beadloom/infrastructure/db"
          reason: *unit-test-opens-an-index
          until: *unit-test-opens-an-index-exit

  # A scenario lives in the folder of the node it binds to:
  # tests/acceptance/<domain>/<node>/, spelled as that node's docs/ folder (owner
  # ruling 2026-09-28, `beadloom-2mj3.4`). Measured 2026-09-28: 524 scenarios in
  # 79 files; the 39 files in node folders all agree with their folder, and every
  # enclosing folder that names a node names a container of it. E1 (`beadloom-cs2o`)
  # rewrote and moved the rule engine's 7, so 33 files in
  # tests/acceptance/features/ are listed below (522 scenarios counted with an
  # Outline as one, 350 agreeing, 172 excused). B3 (`beadloom-d0bp`) left them
  # there because moving them by their tag would put them in the folder of a node
  # their steps do not test. Whether a scenario's steps EXECUTE its node is not
  # judged -- that needs a runtime trace (see the rule module's docstring).
  - name: scenarios-live-in-their-node-folder
    description: "A scenario's @node: tag names the node folder its feature file sits in"
    severity: error
    scenario_binding:
      features: "tests/acceptance/**/*.feature"
      exempt:
        - files:
            - "tests/acceptance/features/attestation_scope.feature"
            - "tests/acceptance/features/bootstrap_self_consistency.feature"
            - "tests/acceptance/features/commit_scope.feature"
            - "tests/acceptance/features/ctx_and_debt_report_read_the_test_binding.feature"
