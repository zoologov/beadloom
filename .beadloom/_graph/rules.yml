version: 3

# A node's layer is declared ON THE NODE, in its own graph file, and nowhere
# else. A top-level `tags:` catalog used to stand here and assign layer tags to
# nodes by name; it was removed in BDL-070 (`beadloom-punn`, RFC Q5). This file
# declares CONSTRAINTS on the graph, while a node's tags are a property OF the
# graph -- letting the constraints file assign node properties made this a
# second graph source with no rule saying which one wins. It had already drifted:
# it named 10 nodes where the graph tags 12, missing `cli-commands` and
# `guard-probes`, and nothing reported it because no production code read it.
# `architecture-layers` below names the four tags; the nodes carry them.

rules:
  - name: domain-needs-parent
    description: "Every domain must be part_of the beadloom service"
    require:
      for: { kind: domain }
      has_edge_to: { ref_id: beadloom }
      edge_kind: part_of

  - name: feature-needs-domain
    description: "Every feature must be part_of a domain"
    require:
      for: { kind: feature }
      has_edge_to: { kind: domain }
      edge_kind: part_of

  - name: service-needs-parent
    description: "Every service (except root) must be part_of the beadloom service"
    require:
      for: { kind: service, exclude: [beadloom] }
      has_edge_to: { ref_id: beadloom }
      edge_kind: part_of

  - name: no-domain-depends-on-service
    description: "Domains must not have depends_on edges to services"
    deny:
      from: { kind: domain }
      to: { kind: service }
      unless_edge: [part_of]

  - name: no-dependency-cycles
    description: "No circular depends_on chains"
    severity: error
    forbid_cycles:
      edge_kind: depends_on

  - name: architecture-layers
    description: "Services → application → domains → infrastructure — not reverse"
    severity: error
    layers:
      - name: services
        tag: layer-service
      - name: application
        tag: layer-application
      - name: domains
        tag: layer-domain
      - name: infrastructure
        tag: layer-infra
    enforce: top-down
    allow_skip: true
    edge_kind: depends_on
    # THE FOURTEEN SAME-LAYER CROSSINGS THIS PROJECT HAS DECIDED ABOUT
    # (BDL-070 B2, `beadloom-xmfs`). An edge inside one layer is legal when both
    # ends share a container the declaration gives a layer, and a finding when
    # they do not (RFC Q1). Measured on this tree on 2026-09-13, over a warm
    # full rebuild of the index: 365 live `depends_on` edges, 357 with a layer
    # at both ends by ancestry, 130 inside one layer, of which 116 run between
    # two parts of one container and 14 between peers. Every one of the 14 is
    # below, with what it is and what would retire it; two more were FIXED
    # rather than excused, by moving the exit-condition vocabulary to
    # `infrastructure/exit_condition.py` where both declarers can reach it
    # without crossing.
    #
    # ONE MEASURED NON-ANSWER, recorded so nobody re-derives it. Nine of the
    # sixteen ran `onboarding -> graph` / `onboarding -> context-oracle`, which
    # reads like a mis-declared layer: onboarding orchestrates bootstrap and
    # that is the application layer's work. Re-tagging `onboarding` as
    # `layer-application` was measured on 2026-09-13 and makes it worse — the
    # nine go away and twenty-two appear, 16 -> 29, because the application
    # layer depends on onboarding in twenty-two places. The declaration is not
    # the defect here.
    exempt:
      # --- The services layer: two services share two seams, and the container
      # that holds both services carries no layer tag. -----------------------
      - from: cli-commands
        to: bd-seam
        reason: >-
          The bd seam is shared by both services on purpose -- funnelling every
          `bd` invocation through one mockable function is the point of it -- and
          its declared container contradicts its use: of the 22 import rows that
          reach it, 18 are the CLI's and 3 the MCP server's. Re-parenting it to
          `cli` does not remove this crossing, it flips which service crosses.
          No available container is right, because the root service `beadloom`
          holds every service and carries no layer tag.
        until: "a services-layer container holds both `cli` and `mcp-server`, or the shared seams become part of neither"
      - from: guard-probes
        to: bd-seam
        reason: >-
          The flow guards read claimed beads through the same one seam
          (`guard_probes.py:80`). Same shared-seam fact as the entry above, and
          it retires with it.
        until: "a services-layer container holds both `cli` and `mcp-server`, or the shared seams become part of neither"
      - from: mcp-server
        to: guard-probes
        reason: >-
          The MCP server exposes the same guard probes the CLI does
          (`mcp_server.py:53`), so the probes are a shared seam too. They are
          declared `part_of cli` and the same re-parenting argument applies:
          moving them flips the direction of the crossing rather than removing
          it.
        until: "a services-layer container holds both `cli` and `mcp-server`, or the shared seams become part of neither"
      # --- The services layer: the entry point starts the other entry points. -
      - from: cli-commands
        to: mcp-server
        reason: >-
          `beadloom mcp serve` starts the MCP server, so the command that starts
          it names it (`commands/setup.py:884`, function-local in the command
          body). Wiring one runnable thing to another is the composition root's
          job and the CLI is this package's composition root.
        until: "both servers are started through a shared entry point rather than one importing the other"
      - from: cli-commands
        to: tui
        reason: >-
          `beadloom dashboard` launches the TUI (`commands/dashboard.py:18`),
          function-local and inside `except ImportError` because `textual` is an
          optional extra. Same composition-root fact as the entry above.
        until: "both servers are started through a shared entry point rather than one importing the other"
      # --- The domain layer: three bounded contexts parse source, and the
      # tree-sitter facilities live inside one of them. -----------------------
      - from: import-resolver
        to: code-indexer
        reason: >-
          The import resolver parses source files with `extract_symbols` and
          `supported_extensions` (`import_resolver.py:15`, `:861`, `:1089`).
          Four of the fourteen crossings are this one dependency: tree-sitter
          parsing is a facility, not `context-oracle`'s domain knowledge, and
          the honest fix is to move it below the domains that parse -- what this
          bead did for the exit-condition vocabulary. `code-indexer` is a feature
          node with its own document and callers, so that is a restructuring
          rather than an import move.
        until: "the tree-sitter symbol facilities move below the domains that parse source, the way `exit-condition` did"
      - from: agent-prime
        to: code-indexer
        reason: >-
          The project scanner counts classes and functions with the same
          `extract_symbols` (`scanner/summary.py:225`). Same facility, same fix,
          and it retires with the entry above.
        until: "the tree-sitter symbol facilities move below the domains that parse source, the way `exit-condition` did"
      - from: doc-generator
        to: context-oracle
        reason: >-
          The doc skeleton writer lists a module's symbols with the same
          `extract_symbols` (`doc_generator.py:398`). Same facility, same fix.
        until: "the tree-sitter symbol facilities move below the domains that parse source, the way `exit-condition` did"
      # --- The domain layer: onboarding drives the domains it is a peer of. ---
      - from: agent-prime
        to: graph
        reason: >-
          `beadloom prime` reports the project's lint health, so it runs the
          linter (`scanner/prime.py:38`). The fix is the shape `beadloom-46am`
          built for the re-index: a port under `onboarding/scanner/` that a
          service above both layers supplies. That is a restructuring with its
          own tests, not an import move, and it is the same port as the entry
          below.
        until: "a lint port under `onboarding/scanner/`, the shape `reindex_port.py` established"
      - from: agent-prime
        to: rule-engine
        reason: >-
          The same `prime` call reads the populations the rules state
          (`scanner/prime.py:39`), from the same lint snapshot. One port
          retires this entry and the one above together. Since BDL-073 B3 the
          edge carries a second import: `scanner/rules_gen.py` labels rules by
          the loader's `AUTHORING_KEYS` instead of a twelve-key copy, because
          the copy fell behind once and the generated AGENTS.md called three
          rules `unknown` (BDL-062 `.4`). The port has to hand over that key
          set as well, or this entry outlives it.
        until: "a lint port under `onboarding/scanner/` that also supplies the authoring keys, the shape `reindex_port.py` established"
      - from: agent-prime
        to: import-resolver
        reason: >-
          The scanner derives a scanned project's `depends_on` edges with the
          graph's own resolver (`scanner/import_scan.py:43`). Re-deriving them
          inside onboarding would be a second answer to what an import edge is,
          which is a worse defect than this crossing.
        until: "a lint port under `onboarding/scanner/`, the shape `reindex_port.py` established"
      - from: graph-files
        to: graph-loader
        reason: >-
          Onboarding writes and reads the project's `_graph/*.yml`, so it reads
          the loader's own answer to what a graph file is (`NOT_A_GRAPH_FILE`,
          `graph_files.py:40`). Restating that sentinel in onboarding would be a
          second definition of the graph format, which is what the loader exists
          to be the only one of.
        until: "the graph file format is stated somewhere both the loader and its writers sit above"
      - from: doc-generator
        to: route-extraction
        reason: >-
          The doc skeleton renders a node's routes with the formatter that owns
          the route vocabulary (`doc_generator.py:1019`). Spelling the table a
          second time in onboarding would give one fact two renderings.
        until: "the doc skeleton's route section is rendered from a renderer both domains sit above"
      # --- The domain layer: a rule about summaries checks them against facts
      # another domain models. ------------------------------------------------
      - from: rule-engine
        to: doc-sync
        reason: >-
          `graph-summary-facts` checks the numbers in a node summary against the
          project's facts, and the fact registry -- `DocScanner`, `FactRegistry`,
          `FactSet`, `compare_facts` -- is `doc-sync`'s model
          (`rules/summary_facts.py:57`). The fix is for the rule to be handed its
          facts by a caller above both domains, which changes the rule engine's
          own evaluation signature.
        until: "the rule engine takes a project's facts as an input rather than reading them"

  # THE SITE'S FRONTEND IS JUDGED THE WAY AN FSD ADOPTER'S IS (BDL-076 A2,
  # `beadloom-iehv`). The VitePress theme (package data under
  # `src/beadloom/site_scaffold/.vitepress/theme` since BDL-076 B1) follows
  # Feature-Sliced Design (owner, 2026-09-30): six layers, and a layer imports only
  # the layers below it. Each slice is a `component` node `part_of vitepress-site`
  # and carries its layer as its OWN tag. There is deliberately no node per layer:
  # a tagged layer container would share itself with every slice inside it, and
  # the rule reads two ends that share a tagged container as internal, so two
  # widgets importing each other would pass. With the tag on the slice and the
  # untagged `vitepress-site` above them, a dependency between two slices of one
  # layer is a same-layer crossing, which is FSD's own rule that slices of a layer
  # do not know each other. `app` and `shared` have segments rather than slices in
  # FSD, so each is one node and its segments import one another freely.
  #
  # The site's edges exist because relative JS/TS/Vue imports resolve to the files
  # they name (BDL-076 J1-J3). `vitepress-site` itself, the VitePress entry file
  # and the scaffold, carries no FSD tag, so its edge into `site-app` is skipped
  # and counted as skipped. `architecture-layers` above skips every site edge for
  # the same reason: the two rules judge disjoint populations.
  - name: site-fsd-layers
    description: "The site's Feature-Sliced layers import downward: app, pages, widgets, features, entities, shared"
    severity: error
    layers:
      - name: app
        tag: fsd-app
      - name: pages
        tag: fsd-pages
      - name: widgets
        tag: fsd-widgets
      - name: features
        tag: fsd-features
      - name: entities
        tag: fsd-entities
      - name: shared
        tag: fsd-shared
    enforce: top-down
    allow_skip: true
    edge_kind: depends_on

  # Recalibrated 200 -> 280 (BDL-059 S3). Cohesion-driven decomposition split the
  # monster FILES (rule_engine.py 2249, federation.py 1000) into cohesive
  # same-domain packages, but a domain's symbol count is unchanged by an
  # in-domain split — `graph` (216) and `application` (251) are legitimately
  # large bounded contexts. Dodging the count by reclassifying nodes is
  # metric-gaming (explicitly rejected); recalibrating the threshold for this
  # codebase's largest contexts is the honest, documented alternative. The limit
  # stays a SIGNAL for genuine re-scoping (a domain > 280), never a target.
  - name: domain-size-limit
    description: "Domains should not have too many symbols"
    severity: warn
    check:
      for: { kind: domain }
      # RECALIBRATED 290 -> 180 because the METRIC CHANGED MEANING (BDL-UX
      # #144): `max_symbols` now counts the symbols a node OWNS — files under
      # its source minus files owned by a more specific node — instead of every
      # file under its path prefix. That is what makes the rule's own remedy
      # work: carving a subpackage into its own node now genuinely relieves the
      # parent. Under the new metric the observed maximum is `application` at
      # 150 (it was 284 under prefix counting), so 290 would never fire again.
      # 180 restores the signal with ~20% headroom.
      #
      # NOTE: this measures a node's OWN code, not its bounded context's total
      # size. A domain carved into many features owns little and will not trip
      # this rule however large the subtree is — that is a separate signal,
      # tracked as BDL-UX #158, deliberately NOT smuggled into this threshold.
      max_symbols: 180

  # COVERAGE lint (BDL-051 S3a) — supersedes the S1 unregistered-feature-candidate
  # sprawl-lint with a stronger, complete-coverage check. Goal: NO SHADOW CODE.
  # Every src/beadloom/**.py module with >= min_symbols indexed symbols must be
  # COVERED: it carries a `feature`/`component` annotation, it IS a node's
  # `source`, OR its path matches an `exempt` glob below. Anything else is a
  # finding. Severity is `warn` for now (S3b classifies every module, then this
  # is promoted to error). The exempt list is VISIBLE here — not a silent escape
  # hatch. Exempt criterion: < N public symbols AND not backing a CLI command AND
  # internal-only (docstring-only glue). Seeded minimally; S3b decides the rest.
  - name: module-coverage
    description: "Every src module must be a tracked node (feature/component/…) or explicitly exempt"
    severity: error
    module_coverage:
      source_root: src/beadloom/
      min_symbols: 1
      exempt:
        - "**/__init__.py"
        - "**/__main__.py"
        - "**/onboarding/config_reader.py"
        - "**/onboarding/presets.py"
        # Pure back-compat re-export shim (0 own symbols). The `rule-engine`
        # node is sourced at the `rules/` PACKAGE, where the engine actually
        # lives — sourcing it at this shim made every symbol count, node page
        # and size limit describe the shim instead of the engine (BDL-UX #157).
        # The file keeps its `# beadloom:feature=rule-engine` annotation to
        # record membership; exemption covers only its lack of own code.
        - "**/graph/rule_engine.py"

  # THE TWO SIDES ARE MATCHED AGAINST DIFFERENT THINGS (BDL-UX #150 — the defect
  # that made these two rules inert; the two ai_agents rules below were reported
  # dead too, but measurement shows their `to:` is already the correct dotted
  # form and their 0 was truthful). `from:` is matched against the
  # repo-relative SOURCE FILE PATH as indexed (`src/beadloom/tui/app.py` — it
  # carries the source root); `to:` against the DOTTED IMPORT PATH with dots
  # turned into slashes (`beadloom/infrastructure/db` — no source root, no
  # extension). A `to:` written as `src/beadloom/…` therefore matches nothing,
  # ever. Both globs are now checked for liveness: a rule that matches zero
  # candidates anywhere in the index is reported (`warn`) instead of counting as
  # clean, so this class of mistake cannot come back silently. A `to:` glob also
  # covers a BARE import of the package it names (`from beadloom.infrastructure
  # import db` is indexed as the target `beadloom/infrastructure`), which is the
  # commonest reach-in form and used to slip through every glob spelling.
  - name: tui-no-direct-infra
    description: "TUI must not import infrastructure directly"
    forbid_import:
      from: "src/beadloom/tui/**"
      to: "beadloom/infrastructure/**"

  # Repairing this glob surfaced 6 pre-existing crossings (measured on a clean
  # index, 2026-08-22), all of them documented designs rather than accidents —
  # `architecture-layers` explicitly permits domain -> infrastructure, and the
  # domain READMEs prescribe these three targets by name. They are BASELINED,
  # not silenced: the rule keeps its full scope, so a NEW onboarding ->
  # infrastructure import still fails, and each exemption carries the reason it
  # exists and the condition that retires it.
  #
  # WHAT THAT BUYS, stated exactly, because the earlier wording here promised a
  # guarantee the code did not provide (review .7 MAJOR 2, fixed in
  # BDL-061.49): every run REPORTS what these entries suppressed — `lint` says
  # "N crossings suppressed by an exemption" beside its violation count and
  # `--format json` lists each one — so a green line can never mean "nothing
  # crossed" when it means "what crossed was excused". An entry that suppresses
  # nothing is reported as dead. An `until:` that LEADS with an ISO date
  # (`2026-09-01`, optionally followed by prose) is parsed, and once that day
  # passes while the entry is still suppressing something, the run says so.
  # The six `until:` values below name an EVENT, not a date — the honest shape
  # here, since what retires them is a landed re-scope rather than a day — and
  # an event is prose that nothing can check. That is why the COUNT, not the
  # date, is the mechanism these entries rely on to be remembered.
  - name: onboarding-no-direct-infra
    description: "Onboarding must not import infrastructure directly"
    forbid_import:
      from: "src/beadloom/onboarding/**"
      to: "beadloom/infrastructure/**"
      exempt:
        - to: "beadloom/infrastructure/atomic_io"
          reason: >-
            Every graph-YAML writer routes through atomic_io by design (see the
            infrastructure README) so a crash mid-write cannot corrupt the
            source-of-truth YAML; the onboarding scaffolders are four of those
            writers. A domain reaching the lowest layer for a crash-safety
            primitive is the layering the project declares, not a breach of it.
          until: >-
            the rule is re-scoped to what it actually means (open no index, run
            no git) — BDL-UX #150 follow-up
        - to: "beadloom/infrastructure/mcp_tools"
          reason: >-
            MCP_TOOL_CATALOG is the single source of the tool list AGENTS.md is
            generated from; it lives at the lowest layer precisely so onboarding
            can read it without importing upward into services.
          until: >-
            the rule is re-scoped to what it actually means — BDL-UX #150
            follow-up
        - to: "beadloom/infrastructure/db"
          reason: >-
            `scanner/prime.py` answers `beadloom prime` from live index queries;
            the read seam it should use (infrastructure/repository) is in the
            same layer, so routing through it would satisfy the glob without
            changing a single dependency direction.
          until: >-
            prime_context() reads through the repository seam and this entry
            goes dead — BDL-UX #150 follow-up
        - from: "src/beadloom/onboarding/doc_generator.py"
          to: "beadloom/infrastructure/node_source"
          reason: >-
            'A file lies under a node's source' was written three times, in three
            domains, and one copy took a sibling's routes (BDL-069
            beadloom-rqma.4). Its one body must be importable by all three, and
            git_activity is infrastructure, which imports nothing above it, so
            the body is here and doc_generator is the one caller that crosses.
            A path predicate opens no index and runs no git. Rejected: a copy in
            onboarding, which is the defect, and a re-export through a domain,
            which satisfies the glob without changing a dependency.
          until: >-
            the rule is re-scoped to what it actually means (open no index, run
            no git) — BDL-UX #150 follow-up
        - to: "beadloom/infrastructure/exit_condition"
          reason: >-
            The same shape as node_source above, and the fifth time this project
            has met it: what retires a declared exclusion is stated once, and
            three surfaces require an `until:` — the two exemption lists in
            rules.yml, read by `graph`, and `guards.<name>.exclusions[]` in
            flow.yml, read by onboarding. The body was written inside `graph`,
            so `config_sync` and `flow_suppression` imported a PEER DOMAIN to
            read it, which was two of the sixteen same-layer crossings BDL-070
            B2 triaged. `architecture-layers` permits domain -> infrastructure
            and forbids the peer crossing, so this trade removes the finding
            that rule makes for a baselined entry under this one — stated
            plainly rather than counted as a clean fix. A date parser opens no
            index and runs no git. Rejected: a copy in onboarding, which gives
            one `until:` two meanings, and a re-export through `graph`, which
            satisfies the glob without changing a dependency.
          until: >-
            the rule is re-scoped to what it actually means (open no index, run
            no git) — BDL-UX #150 follow-up

  # ai_agents is a leaf consumer (BDL-051 / S2): it MAY consume application /
  # context_oracle / graph / doc_sync read APIs + the bd/beadloom shells, but it
  # must NOT be imported BY the core. These two forbid_import rules cover the
  # core source dirs without matching ai_agents' own internal imports — the
  # ``a[!i]*`` pattern picks ``application`` while excluding ``ai_agents``, and
  # ``[!a]*`` picks every other (context_oracle / doc_sync / graph /
  # infrastructure / onboarding / services / tui) source dir.
  - name: core-no-import-ai-agents
    description: "Core domains/services must not import the ai_agents domain"
    severity: error
    forbid_import:
      from: "src/beadloom/[!a]*/**"
      to: "beadloom/ai_agents/**"

  - name: application-no-import-ai-agents
    description: "Application must not import the ai_agents domain (leaf consumer only)"
    severity: error
    forbid_import:
      from: "src/beadloom/a[!i]*/**"
      to: "beadloom/ai_agents/**"

  # Beadloom holds itself to the rule it ships (BDL-061 S4). The population is
  # the honest one — every `feature` node — so the count it prints is the real
  # debt and not a hand-picked list that reports 0 by construction. It is `warn`
  # by design: a finding about declared INTENT is not a finding about code, and
  # `error` would turn every adopter's green project red on the upgrade that
  # ships the rule. Loudness replaces blocking, and every message carries the
  # population it is a fraction of.
  - name: scenario-coverage
    description: "Behaviour-bearing nodes carry an executable scenario; a scenario names its bead"
    severity: warn
    scenario_coverage:
      for: { kind: feature }
      # The whole acceptance tree (BDL-074 B3, then beadloom-2mj3.4): a scenario
      # lives in the folder of the node it binds to, tests/acceptance/<domain>/<node>/,
      # spelled as that node's docs/ folder is; one whose @node: tag disagrees with
      # the node its steps execute stays in tests/acceptance/features/ until its
      # content is rewritten.
      features: "tests/acceptance/**/*.feature"
      references:
        - ".claude/development/docs/features/**/PRD.md"
        - ".claude/development/docs/features/**/BRIEF.md"

  # A node documents itself where this graph says nodes like it are documented
  # (BDL-062 `.2`). The convention is DERIVED from the graph — no directory name
  # appears here or in the rule — so what is configured is only how much
  # agreement counts as a convention. `error` rather than the shipped `warn`:
  # this repository's layout has been settled since BDL-051 and a contradiction
  # is a defect, not a matter of taste. An adopter gets `warn`, because a
  # convention check that fails a green project's first run on its own house
  # style is a check that gets switched off.
  #
  # This repository has two source trees, `src/` and `site/`, and each is judged
  # against its own documents (`beadloom-5o48`, BDL-076 K3). From 2026-09-30 until
  # that fix the site's seventeen slice nodes made the rule check none of 126
  # pairs, and it sat at `warn`. Measured after the fix on the same graph: 117 of
  # 126 pairs fall under a dominant mapping, 102 under `src/beadloom` and 15 under
  # `site/.vitepress/theme`, and 0 contradict it.
  #
  # BDL-076 B1 (`beadloom-dfwt`) moved the theme into the package, so `src/` is
  # again the one source tree and the site's slices are judged inside it.
  # Measured after the move: 122 of 129 pairs fall under a dominant mapping, the
  # twenty slices among them (`site_scaffold` -> `vitepress_site`), and 0
  # contradict it.
  - name: doc-area-coherence
    description: "A node is documented where this graph documents nodes from its source area"
    severity: error
    doc_area_coherence:
      threshold: 0.6
      min_support: 2

  # A number stated in a node's `summary` agrees with the same fact computed
  # from the project (BDL-062 `.1`). A summary is the sentence `ctx`, `prime`,
  # the generated site and every agent adapter quote, and until this rule nothing
  # compared it against anything: the root node claimed `v1.5.0` across three
  # major releases and `mcp-server` claimed 14 tools against a catalogue of 18.
  # `summary_facts` takes no keys — what counts as a version, what counts as a
  # claim about a count and how close a count has to be all come from the
  # documentation audit, so a knob here would be a second answer to a question
  # already answered. `error` is the shipped default rather than the `warn` a
  # convention check gets: a number that contradicts the project it describes is
  # wrong in every house style, and the value is in the adopter's own graph.
  - name: graph-summary-facts
    description: "A number or version stated in a node summary agrees with the project"
    severity: error
    summary_facts: {}

  # THE TEST SUITE, JUDGED AGAINST THE GRAPH (BDL-074 C3). Three rules over the
  # binding the reindex records: a test file to the node whose code its path
  # mirrors (or whose `tests:` list names it), an acceptance scenario to the node
  # its folder names. Each prints what it judged and what it could not on every
  # run (`suite_population`, an advisory: it decides nothing and `--fail-on-warn`
  # does not exit on it).
  #
  # MEASURED ON THIS TREE, 2026-09-28, after a full reindex: 560 indexed test
  # files -- 202 bound to a node, 184 unplaced, 174 bound by other means
  # (acceptance step files and self-checks). Every one of the 184 was listed
  # below by path, in three groups with their reason: 169 files the suite map
  # measured as exercising several nodes (or both kinds), 14 written or renamed
  # after the map, and 1 helper the `*_test.py` pattern matches. A path, not a
  # glob, so a NEW file placed nowhere is an error, and a listed file that moves
  # to its node's folder is reported the next run as an entry to delete.
  # RE-MEASURED after E1 (`beadloom-cs2o`) split the rule engine's 8 of them by
  # node: 578 indexed, 228 bound, 176 unplaced (all listed), 174 by other means.
  # CORRECTED by F1 (`beadloom-2mj3.6`): "by other means" was true of the 73
  # acceptance step files (their scenarios bind by @node: tag) and false of the 101
  # self-checks (they bind to no node, by design); the rule now names each kind by
  # its count. Six files the map measured as executing no src/ line moved out of
  # the mixed group, whose reason was false for them, into a fourth group.
  # CORRECTED AGAIN by G3 (`beadloom-2mj3.12`): the mixed group's reason was false
  # for three more files, checked against the map. Two were F2's split remainders,
  # which the map never measured; each is now split again, its bundle half under
  # context-builder and its markdown half under cli-commands. The third was
  # measured as one node (`exit-condition`) and unit tests only, and moved under
  # that node's mirrored path. The group's `until` no longer names E1, closed.
