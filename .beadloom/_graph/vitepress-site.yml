  # Site consumer: the VitePress portal. It CONSUMES the data the beadloom
  # service produces (the generated graph pages, dashboard.data.json, landscape
  # Mermaid). Modelled so the own-site landscape map shows a real, honest
  # producer->consumer contract (BDL-041 F4.4) instead of a foreign fixture.
  #
  # BDL-076 B1 (`beadloom-dfwt`): the portal's scaffold -- the theme, the viewer,
  # package.json, the lockfile, the VitePress config and the browser tests --
  # moved from `site/` into the package, `src/beadloom/site_scaffold/`, laid out
  # as it sits in a portal. It ships in the wheel as package data and
  # `beadloom docs site` writes it into every project's portal, this one's
  # included. The node follows the code: its slices are judged where they are
  # written, and `site/` is output.
nodes:
  - ref_id: vitepress-site
    kind: site
    summary: "The VitePress portal scaffold shipped in the wheel — renders the beadloom-produced site data (graph pages, dashboard.data.json, landscape Mermaid)"
    source: src/beadloom/site_scaffold/
    # The document replaced the `docs_absent` reason of BDL-062 `.4` when the
    # theme became a scan path (BDL-076 A0, `beadloom-kcwz`): the reason was that
    # no sync pair could hold a document here, and now one can.
    docs:
      - docs/services/vitepress-site.md
    # The Playwright tests of BDL-076 A5 live under the scaffold's `e2e/`, a test root in
    # `.beadloom/config.yml`. A file directly under that root sits in no kind
    # folder, so it binds by a declaration rather than by the mirror. Each spec
    # is declared by the slice it drives, and the most specific declaration wins
    # (BDL-076 R1 finding m5); this prefix binds a spec no slice declares.
    tests:
      - src/beadloom/site_scaffold/e2e/
edges:
  # Real producer->consumer contract (BDL-041 F4.4): the beadloom service
  # PRODUCES the site data (graph pages, dashboard.data.json, landscape Mermaid);
  # the VitePress site CONSUMES it. Both sides share one contract_key so the
  # local landscape map reconciles them to a CONFIRMED verdict (honest, real).
  - src: vitepress-site
    dst: beadloom
    kind: part_of
  - src: vitepress-site
    dst: beadloom
    kind: consumes
    contract:
      protocol: site-data
      message_type: site-bundle
      direction: consumes
