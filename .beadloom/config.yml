languages:
- .py
scan_paths:
- src
sync:
  hook_mode: warn
docs_audit:
  # Targeted false-positive suppressions (BDL-057.6). Each {path, fact, value}
  # triple silences exactly one keyword-proximity false match — it does NOT mask
  # genuine stale facts of the same type elsewhere (those stay flagged). Confirmed
  # false positives by review (BDL-057.4):
  #  - "14 graph read/write tools" is the graph subset of the 18 MCP tools
  #    (the full 18 is stated in the same sentence) — not a stale total.
  #  - README "20 ms" is a latency figure, not the node_count.
  #  - agentic-flow "(was 14)" is a deliberate historical reference.
  #  - SECURITY "14 graph tools" / "12 read tools" are subsets of the 18 MCP tools
  #    (the full 18 is stated alongside), not stale totals.
  # Retired by BDL-061.44 (token-boundary extraction): the vitepress "404"
  # and the ai-techwriter "3.10-3.13" entries suppressed mentions the scanner
  # no longer produces, and a suppression that matches nothing reads as coverage
  # it does not have. Measured: 0 matching mentions repo-wide.
  # Retired by BDL-061.45 (clause-scoped matching) for the same reason, measured
  # the same way: README.ru cli_command_count=14, getting-started
  # mcp_tool_count=14 and SECURITY mcp_tool_count=14 were all "N tools: 14 over
  # the graph" breakdowns, which the extractor no longer binds to the noun on
  # the other side of the separator. 0 matching mentions repo-wide afterwards.
  # Retired by BDL-062.7 for the same reason, measured the same way:
  # context-oracle/README language_count=12. The prose said "12 languages"
  # while the table under it lists ELEVEN languages over seventeen extensions,
  # so the suppressed mention was also WRONG -- the triple was hiding a stale
  # claim, not a false positive. The count is now stated as a word beside the
  # table that is its authority, because `language_count` means the languages
  # the audited project is WRITTEN in (1 here) and no digit beside the word
  # "languages" in a sentence about parser breadth can ever be genuinely
  # checked. Measured: 0 language_count mentions over 99 documents afterwards,
  # and `TestEverySuppressionStillSuppresses` (BDL-062.5) fails while the
  # triple stands -- the first time an inert triple was caught by a check
  # rather than by a sweep (BDL-UX #200).
  # Retired by BDL-062.4 (BDL-UX #193) for the same reason, measured the same
  # way: context-oracle/README framework_count=12. The fact was renamed to
  # `nodes_with_framework` with keywords that mean nodes rather than
  # frameworks, so "12 frameworks" is no longer read as a claim about it at
  # all and the triple named a fact that no longer exists. Measured: 0
  # framework-family mentions over 58 documents repo-wide afterwards.
  ignore:
    # Retired 2026-08-27 (BDL-062, README restructure), measured: 0 matching
    # mentions repo-wide. Both guarded sentences are gone, not reworded. The
    # README's "20 ms" latency figure that node_count=20 covered went with the
    # comparison table it stood in; the "14 graph read/write tools" breakdown
    # that mcp_tool_count=14 covered went when the MCP section became a link to
    # docs/services/mcp.md. `TestEverySuppressionStillSuppresses` caught both in
    # CI the moment they went inert, which is what that test exists for (#200).
    - path: docs/architecture.md
      fact: mcp_tool_count
      value: 14
    - path: docs/guides/agentic-flow.md
      fact: mcp_tool_count
      value: 14
    - path: docs/services/mcp.md
      fact: mcp_tool_count
      value: 14
    - path: SECURITY.md
      fact: mcp_tool_count
      value: 12
    # Retired 2026-08-27 (BDL-064, multi-agent-development rewrite), measured
    # with a real DocScanner: 0 matching mentions in either file, and 1 mention
    # total across the pair (`mcp_tool_count=18`, which is correct and stays
    # checked). The two triples covered the guide's `version=2.0.0` sentences --
    # "since 2.0.0 the orchestrator lives in the package", "since 2.0.0 the
    # packaged workflow is not tied to one tool", "in 2.0.0 Beadloom applied its
    # own thesis to itself". All three were release archaeology addressed to a
    # reader on 3.0.2, and the rewrite states what the orchestrator IS rather
    # than which release it moved in, so the sentences are gone rather than
    # reworded. `TestEverySuppressionStillSuppresses` caught both the moment
    # they went inert, which is what that test exists for (#200).
    # cli.md's `docs audit` reference: the token `v2.2.0` is the EXAMPLE of a
    # token the claim extractor must not read as a claim, printed inside the
    # sentence that states the rule. `_extract_versions` does not share that
    # tokenizer — it matches every `\bv?\d+\.\d+\.\d+\b` outside a pin — so
    # the sentence explaining the rule is the one the rule cannot survive
    # (BDL-UX #190, open). Suppressed by triple rather than reworded, because
    # the illustration is the point of the sentence. It becomes inert the day
    # #190 lands, and an inert rule is reported.
    - path: docs/services/cli.md
      fact: version
      value: "v2.2.0"
    # architecture-model guide: "the alternative shipped in 3.0.0 was worse"
    # names the behaviour a PRIOR release had, in a passage explaining why
    # `graph-summary-facts` ships at `error`. The sentence is permanently true
    # and can only ever be read as stale, because `_extract_versions` matches
    # every `\bv?\d+\.\d+\.\d+\b` and has no notion of a past tense
    # (BDL-UX #205, the general form). Same shape and same justification as the
    # two multi-agent-development triples above. It goes inert only if that
    # passage is deleted, and `TestEverySuppressionStillSuppresses` reports it
    # the day it does.
    - path: docs/guides/architecture-model.md
      fact: version
      value: "3.0.0"
    # application/README: `bd 1.0.4` is the version of the BEADS CLI the
    # landing-lock measurement was taken against, not a claim about this
    # project's version. `_extract_versions` matches every
    # `\bv?\d+\.\d+\.\d+\b` outside a pin and has no notion of whose product a
    # version belongs to, so a document that states which release of a
    # DEPENDENCY a measurement was taken on cannot say so without being read as
    # stale. That is a third form of BDL-UX #190/#205 — not an example token
    # and not a past tense, but another product's number — and it is filed as
    # #253. The version is load-bearing here: the sentence states what a tool
    # was measured to do, and a measurement without the version it was taken
    # against is the kind of claim this project rejects from everyone else.
    # It goes inert only if the sentence is deleted, and
    # `TestEverySuppressionStillSuppresses` reports it the day it does.
    - path: docs/domains/application/README.md
      fact: version
      value: "1.0.4"
    # services/cli.md: the same sentence in the `waves` reference, and the same
    # reason. Two triples for one measurement in one bead is itself the
    # measurement that says #253 is a class rather than an instance: every
    # document that describes what a dependency was measured to do needs one.
    - path: docs/services/cli.md
      fact: version
      value: "1.0.4"
    # services/components/bd-seam/DOC.md: the same class again, and the count is
    # now the argument. `beadloom-0mdo.51` needed a THIRD triple for the same one
    # sentence-shape in the same slice — "measured on bd 1.0.4" — this time in the
    # component doc of the seam whose whole subject is what a specific release of
    # `bd` was measured to do. Three triples, three documents, one measurement:
    # #253 is a class, and the shape of its fix is a fact that knows whose product
    # a version belongs to rather than a suppression per document. Load-bearing
    # here for a stronger reason than in the other two: the module records
    # `BD_MEASURED_VERSION` and a test fails when a different `bd` is installed,
    # so deleting the version from the prose would leave the doc describing a
    # measurement it cannot attribute while the code still can.
    - path: docs/services/components/bd-seam/DOC.md
      fact: version
      value: "1.0.4"
    # services/mcp.md: the FOURTH triple for the same sentence shape, and the
    # fourth is what settles the argument the third one opened.
    # `beadloom-0mdo.52` documented why `complete_bead` confirms `--suggest-next`
    # against `bd ready`, which cannot be written without naming the release the
    # defect was measured on — twenty-three dependency shapes on bd 1.0.4. Four
    # documents, one dependency, one measurement, and each new document that
    # describes what a dependency was measured to do will need a fifth. The fix
    # is a fact that knows whose product a version belongs to, so `1.0.4` beside
    # the word `bd` is never read as a claim about Beadloom's own version
    # (BDL-UX #253). Until then the triple is load-bearing: deleting the release
    # from the prose would leave the tool's documentation describing a
    # confirmation whose reason it can no longer attribute.
    - path: docs/services/mcp.md
      fact: version
      value: "1.0.4"
